  return btn;
}
/** Glossary of the six level files, built once: token key -> glossary entry. A level that fails is skipped (never rejects).
 *  The first entry of a key wins, except that an entry with an empty fr is replaced by a later one that has a translation. */
const SituationsGlossary = { index: null, promise: null };
function situationsGlossIndex() {
  if (!SituationsGlossary.promise) {
    SituationsGlossary.promise = Promise.allSettled(SITUATIONS_LEVELS.map((lv) => loadLevel(lv)))
      .then((results) => {
        const index = new Map();
        for (const r of results) {
          if (r.status !== "fulfilled" || !(r.value instanceof Map)) continue;
          for (const t of r.value.values()) {
            if (!isObj(t) || !isObj(t.glossary)) continue;
            for (const [key, g] of Object.entries(t.glossary)) {
              if (!isObj(g)) continue;
              const cur = index.get(key);
              if (!cur || (!str(cur.fr) && str(g.fr))) index.set(key, g);
            }
          }
        }
        return index;
      })
      .then((index) => situationsAddGeneratedGloss(index))
      .then((index) => { SituationsGlossary.index = index; return index; })
      .catch(() => { SituationsGlossary.index = new Map(); return SituationsGlossary.index; });
  }
  return SituationsGlossary.promise;
}
/** Last resort, after the text glossaries: data/situations-glossary.json (translations of the situation words that no text glossary covers).
 *  It adds the keys absent from the index, or those whose entry has no translation yet; a translated text entry is never overwritten.
 *  A missing or unreadable file is ignored: the index then keeps the text glossaries only. */
function situationsAddGeneratedGloss(index) {
  return fetch("data/situations-glossary.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => {
      const words = isObj(j) && isObj(j.words) ? j.words : {};
      for (const [key, g] of Object.entries(words)) {
        if (!isObj(g) || !str(g.fr)) continue;
        const cur = index.get(key);
        if (cur && str(cur.fr)) continue;
        index.set(key, {
          l: str(cur && cur.l) || str(g.l),
          fr: str(g.fr),
          pos: str(cur && cur.pos) || str(g.pos),
          g: str(cur && cur.g)
        });
      }
    })
    .catch(() => {})
    .then(() => index);
}
/** Fills fr (and empty pos / g) of saved situation words that lack a translation, from the glossary index. Never overwrites a filled field. */
function situationsFillSavedGloss(index) {
  if (!index) return;
  for (const [key, rec] of Object.entries(S.words)) {
    if (!rec || rec.del || str(rec.fr) || !rec.lemma) continue;
    // the index is keyed by the form as it appears in the text (as when the word is added), then by the lemma
    const byForm = index.get(str(rec.form).toLowerCase());
    const g = byForm && str(byForm.fr) ? byForm : index.get(rec.lemma);
    if (!g || !str(g.fr)) continue;
    putWord(key, { ...rec, fr: str(g.fr), pos: str(rec.pos) || str(g.pos), g: str(rec.g) || str(g.g) });
  }
}
/** Click on a word of the revealed sentence: adds it to My words, or removes it (with Annuler), as the reader's popover does.
 *  Adding waits for the glossary index (only the first time) so that the translation is stored with the word. */
function situationsToggleWord(tk, it) {
  const key = situationsWordKey(tk.key);
  if (isSaved(key) && S.words[key].pos !== "formule" && addContext(key, str(it.answer), str(it.translation_fr), it.id)) {
    toast(`“${tk.text}”: situation added to its contexts.`);
    situationsRefreshWords();
    return;
  }
  if (isSaved(key)) {
    const prev = S.words[key];
    putWord(key, { del: true });
    toast(`“${prev.lemma || tk.text}” removed from My words.`, { label: "Undo", run: () => { putWord(key, { ...prev }); situationsRefreshWords(); } });
    situationsRefreshWords();
    return;
  }
  const add = (index) => {
    // the state may have changed while the index was loading: never overwrite a word saved in the meantime
    const k = situationsWordKey(tk.key);
    if (!isSaved(k)) {
      const old = S.words[k];
      const g = (index && index.get(tk.key)) || null;
      if (g && str(g.fr)) {
        putWord(k, {
          lemma: str(g.l) || tk.key, form: tk.text,
          fr: (old && str(old.fr)) || str(g.fr), pos: (old && str(old.pos)) || str(g.pos), g: (old && str(old.g)) || str(g.g),
          ex: { sv: it.answer, fr: it.translation_fr }, textId: it.id, level: it.level,
          box: 1, due: today(), added: (old && old.added) || Date.now()
        });
        toast(`“${tk.text}” added to My words.`);
      } else {
        // the word means nothing on its own here: save the whole formulation of the sentence instead
        const fk = `${tk.key}|${it.id}`;
        putWord(fk, {
          lemma: str(it.answer), form: tk.text,
          fr: str(it.translation_fr), pos: "formule", g: str(it.style_fr),
          ex: { sv: it.answer, fr: it.translation_fr }, textId: it.id, level: it.level,
          box: 1, due: today(), added: Date.now()
        });
        toast(`“${it.answer}” added to My words (full phrase).`);
      }
    }
    situationsRefreshWords();
  };
  if (SituationsGlossary.index) add(SituationsGlossary.index);
  else situationsGlossIndex().then(add, () => add(null));
}
/** Repaints the saved state of the revealed words (after a click or an Annuler), and completes the translations of saved words once the glossary is known. */
function situationsRefreshWords() {
  for (const b of document.querySelectorAll(".sit-words .w")) if (b._paint) b._paint();
  if (SituationsGlossary.index) situationsFillSavedGloss(SituationsGlossary.index);
}
function situationsEndView() {
  const total = SituationsGame.deck.length, s = SituationsGame.score, e = SituationsGame.errors;
  return h("div", { class: "state", role: "status", id: "s-end", style: "max-width:40rem" },
    h("span", { class: "label", title: `Themes: ${situationsThemesNames(SituationsGame.themes)}`,
      text: `Game over · Situations ${situationsLevelsLabel(SituationsGame.levels)} · ${situationsThemesLabel(SituationsGame.themes)}` }),
    h("h2", { text: `${plural(s, "bonne réponse", "correct answers")} sur ${total}` }),
    h("p", { text: `Score: ${s} / ${total} (${Math.round((s / total) * 100)} %). Errors: ${e}.` }),
    SituationsGame.notice ? h("p", { class: "sit-notice", text: SituationsGame.notice }) : null,
    h("div", { class: "g-actions" },
      h("button", { class: "btn primary", type: "button", id: "s-again", text: "Rejouer", onclick: () => situationsStart() }),
      h("button", { class: "btn", type: "button", id: "s-change", text: "Change level or theme",
        onclick: () => { SituationsGame.status = "setup"; renderGame(); const c = $("#s-levels input:checked"); if (c) c.focus(); } })));
}


/* =====================================================================
   14. TOASTS
   ===================================================================== */
function toast(msg, action) {
  const box = $("#toasts");
  const el = h("div", { class: "toast", role: "status" }, h("span", { text: msg }));
  if (action) el.append(h("button", { type: "button", text: action.label, onclick: () => { el.remove(); action.run(); } }));
  while (box.children.length >= 2) box.firstChild.remove();
  box.append(el);
  setTimeout(() => el.remove(), action ? 6500 : 3200);
}

/* =====================================================================
   15. GLOBAL EVENTS: player controls, keyboard, outside clicks
   ===================================================================== */
function wireShell() {
  $("#btn-play").replaceChildren(icon("play"));
  $("#btn-prev").replaceChildren(icon("prev"));
  $("#btn-next").replaceChildren(icon("next"));
  $("#btn-play").addEventListener("click", () => { closePop(); Player.toggle(); });
  $("#btn-prev").addEventListener("click", () => { closePop(); Player.prev(); });
  $("#btn-next").addEventListener("click", () => { closePop(); Player.next(); });
  $("#btn-tools").addEventListener("click", (e) => {
    const t = $("#tools"); t.hidden = !t.hidden;
    e.currentTarget.setAttribute("aria-expanded", String(!t.hidden));
    renderPlayer();
  });
  $("#rate").addEventListener("input", (e) => {
    if (!R) return;
    const v = Math.round(Number(e.target.value) * 100) / 100;
    const lv = R.t.level;
    changeSettings((s) => { if (v === RATE_DEFAULT[lv]) delete s.rates[lv]; else s.rates[lv] = v; });
    $("#rate-out").textContent = fmtRate(v);
    $("#btn-tools").textContent = fmtRate(v);
    Player.restartSoon();
  });
  // Delegated: font size & translation toggles exist in the reader header and the player panel
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-size]");
    if (!b) return;
    changeSettings((s) => { s.fontSize = clamp(s.fontSize + 2 * Number(b.dataset.size), FONT_MIN, FONT_MAX); });
    applySettings();
    positionPop();
  });
  document.addEventListener("change", (e) => {
    if (!e.target.matches("[data-tr-toggle]")) return;
    changeSettings((s) => { s.showTr = e.target.checked; });
    applySettings();
  });
  $("#scrim").addEventListener("click", () => closePop());
  document.addEventListener("pointerdown", (e) => {
    const pop = $("#pop");
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest(".w") && window.innerWidth >= 760) closePop();
  });
  window.addEventListener("scroll", () => { if (!$("#pop").hidden && window.innerWidth >= 760) positionPop(); }, { passive: true });
  window.addEventListener("resize", () => { positionPop(); if (R) renderPlayer(); });
  window.addEventListener("hashchange", () => route(location.hash));
  window.addEventListener("pagehide", () => Persist.flushAll());
  document.addEventListener("visibilitychange", () => { if (document.hidden) Persist.flushAll(); });
  for (const a of document.querySelectorAll("[data-nav]")) {
    a.addEventListener("click", (e) => { e.preventDefault(); const k = a.dataset.nav; if (App.view === "review") App.view = ""; go(k === "lib" ? "" : k); });
  }
  document.addEventListener("keydown", onKey);
}
function onKey(e) {
  if (e.key === "Escape") {
    if (closePop(true)) { e.preventDefault(); return; }
    const t = $("#tools");
    if (!t.hidden) { t.hidden = true; $("#btn-tools").setAttribute("aria-expanded", "false"); $("#btn-tools").focus(); e.preventDefault(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target;
  const tag = tg && tg.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tg && tg.isContentEditable)) return;
  if (App.view === "review") {
    if (e.key === " " && !Review.flipped && tag !== "BUTTON") { e.preventDefault(); $("#rv-flip") && $("#rv-flip").click(); }
    else if (Review.flipped && e.key === "1") $("#rv-again") && $("#rv-again").click();
    else if (Review.flipped && e.key === "2") $("#rv-know") && $("#rv-know").click();
    return;
  }
  if (App.view !== "reader" || !R) return;
  const onWord = tg && tg.classList && tg.classList.contains("w");
  if (e.key === " " || e.code === "Space") {
    if (tag === "BUTTON" || tag === "A" || tag === "SUMMARY") return;
    e.preventDefault(); closePop(); Player.toggle();
  } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    if (onWord) {   // roving focus between words
      const all = [...document.querySelectorAll(".r-title .w, .text .w")];
      const i = all.indexOf(tg) + (e.key === "ArrowRight" ? 1 : -1);
      if (all[i]) { setRoving(all[i]); all[i].focus(); }
      return;
    }
    closePop();
    e.key === "ArrowLeft" ? Player.prev() : Player.next();
  } else if (e.key === "Enter" && onWord) {
    e.preventDefault(); openWord(tg);
  }
}

/* =====================================================================
   16. BOOT — first paint never waits for db/user or voices
   ===================================================================== */
function start(hot) {
  document.documentElement.lang = "en";
  Persist.loadLocal();
  applySettings();
  wireShell();
  updateBadge();
  renderSyncNote();
  initVoices();
  route((hot && hot.route) || location.hash);
  const afterCatalog = () => { if (App.view === "lib") renderLibrary(); else if (App.view === "jeu") renderGame(); };
  loadCatalog().then(afterCatalog, afterCatalog);
  Remote.connect().catch(() => { Remote.status = "off"; renderSyncNote(); });   // sync failure: keep local storage
  // Re-evaluate due cards when the day changes while the page stays open.
  setInterval(updateBadge, 60 * 1000);
}
(function boot() {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ route: location.hash })); } catch { /* optional */ }
  let started = false;   // start() runs exactly once, whichever path gets there first
  const launch = (data) => { if (started) return; started = true; start(data); };
  try {
    if (hot && typeof hot.ready === "function") { hot.ready(launch); return; }
  } catch (err) {
    console.error("Host start failed, standalone mode", err);   // log, do not swallow; standalone start below if not started
  }
  launch((hot && hot.data) || {});   // no-op if start() already ran (started flag)
})();

/* PWA: service worker registration (optional; never blocks rendering). */
(function registerSW() {
  try {
    if (!("serviceWorker" in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;
    const go = () => {
      try {
        navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => { /* offline mode unavailable */ });
      } catch { /* ignore */ }
    };
    if (document.readyState === "complete") go(); else window.addEventListener("load", go, { once: true });
  } catch { /* ignore */ }
})();
</script>
