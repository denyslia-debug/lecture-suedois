<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Read and listen to Swedish texts, from level A1 to C2.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D594B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#7DC6AA" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Läsning">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Svenska Läsaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Schibsted+Grotesk:wght@400..900&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout: phone-first single column — oversized level sign-plates (the one
   loud element) over a ruled library catalogue; the reader is one ~65ch
   Literata column with hymnal-style sentence numbers, play-script speaker
   labels and a player bar docked to the bottom edge.
   ===================================================================== */
:root{
  /* Core palette — calm, high-contrast tones for long reading */
  --papper:#F6F3EC;      /* warm paper, not glaring */
  --blaeck:#22202A;      /* near-black ink, maximum contrast */
  --grafit:#5C5766;      /* graphite: secondary text */
  --gran:#A23F6B;        /* muted rose: the single UI accent */
  --markor:#F2E6B0;      /* soft highlighter: here, now */
  --stampel:#8A2D57;     /* deep magenta: saved words, due dates */

  /* Derived surfaces (explicit per theme, no color-mix dependency) */
  --surface:#FCFBF8;
  --rule:#E3DCCD;
  --rule-2:#CBBFA8;
  --band:#EEE6C4;        /* current sentence */
  --hover:#ECE6D9;       /* word hover */
  --on-markor:#22202A;
  --on-gran:#FFFFFF;
  --scrim:rgba(34,32,42,.3);
  --shadow:0 10px 28px rgba(34,32,42,.12), 0 2px 6px rgba(34,32,42,.06);

  /* Speakers: rose, gold, violet */
  --sp-a:#A23F6B;
  --sp-b:#8A5A00;
  --sp-c:#6B4A8C;
  --sp-n:#5C5766;

  /* Semantic (separate from the accent) */
  --ok:#2E6B47;
  --bad:#A3261E;

  /* Type roles */
  --f-read:"Literata","Iowan Old Style","Charter","Georgia","Cambria",serif;          /* reading */
  --f-sign:"Schibsted Grotesk","Helvetica Neue","Arial",system-ui,sans-serif;        /* signage / UI */
  --f-type:"Courier Prime","Courier New",Courier,ui-monospace,monospace;              /* catalogue-card typewriter: data */

  --read-size:20px;
  --measure:65ch;
  --bar-h:76px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papper:#1C1A20; --blaeck:#ECE7DD; --grafit:#AEA8B6; --gran:#E07AA0; --markor:#524A22; --stampel:#EBA3C4;
    --surface:#26232B; --rule:#3A3640; --rule-2:#554D60; --band:#3A3520; --hover:#302C36;
    --on-markor:#F3EEDC; --on-gran:#1C1A20; --scrim:rgba(0,0,0,.55);
    --shadow:0 14px 36px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
    --sp-a:#E894B8; --sp-b:#E0C070; --sp-c:#C3A5E0; --sp-n:#AEA8B6; --ok:#8FCFA5; --bad:#F09088;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papper:#1C1A20; --blaeck:#ECE7DD; --grafit:#AEA8B6; --gran:#E07AA0; --markor:#524A22; --stampel:#EBA3C4;
  --surface:#26232B; --rule:#3A3640; --rule-2:#554D60; --band:#3A3520; --hover:#302C36;
  --on-markor:#F3EEDC; --on-gran:#1C1A20; --scrim:rgba(0,0,0,.55);
  --shadow:0 14px 36px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35);
  --sp-a:#E894B8; --sp-b:#E0C070; --sp-c:#C3A5E0; --sp-n:#AEA8B6; --ok:#8FCFA5; --bad:#F09088;
  color-scheme:dark;
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--papper);color:var(--blaeck);font:400 16px/1.6 var(--f-sign);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gran);text-underline-offset:.18em}
:focus-visible{outline:2.5px solid var(--gran);outline-offset:2px;border-radius:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.ic{width:1.25em;height:1.25em;fill:currentColor;flex:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1140px;margin-inline:auto}

/* Controls: one family — soft radii, quiet borders, a single rose accent,
   gentle press and focus states, all on the same timing */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border:1px solid var(--rule-2);border-radius:10px;background:var(--surface);color:var(--blaeck);font:600 14.5px/1.2 var(--f-sign);text-decoration:none;text-align:center;box-shadow:0 1px 2px rgba(74,31,53,.06);transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--blaeck);background:var(--hover)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--gran);border-color:var(--gran);color:var(--on-gran);box-shadow:0 4px 14px rgba(162,63,107,.28)}
.btn.primary:hover{background:var(--stampel);border-color:var(--stampel);box-shadow:0 6px 18px rgba(162,63,107,.32)}
.btn.quiet{border-color:transparent;background:transparent;box-shadow:none;padding-inline:10px}
.btn.quiet:hover{background:var(--hover);border-color:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);border-radius:999px;background:var(--surface);padding:7px 14px;font:500 13.5px/1.2 var(--f-sign);color:var(--blaeck);cursor:pointer;transition:background-color .15s ease,border-color .15s ease,color .15s ease,transform .1s ease}
.chip:hover{border-color:var(--blaeck);background:var(--hover)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--blaeck);border-color:var(--blaeck);color:var(--papper)}
.label{font:600 11.5px/1.3 var(--f-sign);letter-spacing:.11em;text-transform:uppercase;color:var(--grafit)}
.typed{font-family:var(--f-type);font-variant-numeric:tabular-nums}
.muted{color:var(--grafit)}
.switch{display:inline-flex;align-items:center;gap:12px;font:500 14px var(--f-sign);cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;border-radius:999px;background:var(--grafit);position:relative;margin:0;cursor:pointer;transition:background-color .2s ease}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.switch input:checked{background:var(--gran)}
.switch input:checked::after{transform:translateX(18px)}
.switch input:focus-visible{outline:2.5px solid var(--gran);outline-offset:3px}
input[type="checkbox"]{accent-color:var(--gran);width:18px;height:18px;margin:0;cursor:pointer}

/* =====================================================================
   APP HEADER
   ===================================================================== */
.app-head{border-bottom:1.5px solid var(--blaeck);padding-block:12px 0}
.app-head .inner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;text-decoration:none;color:var(--blaeck)}
.brand b{font:850 21px/1 var(--f-sign);letter-spacing:-.02em}
.brand span{font:italic 400 14px var(--f-read);color:var(--grafit)}
.nav{display:flex;gap:2px;margin-bottom:-1.5px}
.nav a{position:relative;display:flex;align-items:center;gap:7px;padding:9px 12px 11px;font:600 14px/1 var(--f-sign);color:var(--grafit);text-decoration:none;border-bottom:3px solid transparent}
.nav a:hover{color:var(--blaeck)}
.nav a[aria-current="page"]{color:var(--blaeck);border-bottom-color:var(--blaeck)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--stampel);color:var(--papper);font:700 11.5px/1 var(--f-type)}
@media (max-width:520px){
  .app-head .inner{flex-direction:column;align-items:stretch}
  .nav{justify-content:space-between}
  .nav a{padding-inline:6px}
}
@media (max-width:520px){.nav{flex-wrap:wrap;row-gap:2px}.nav a{white-space:nowrap}}

main{display:block;padding-block:22px 64px}
.view-reader main,.view-reader + .foot{padding-bottom:calc(var(--bar-h) + 48px + env(safe-area-inset-bottom,0px))}

/* =====================================================================
   LIBRARY
   ===================================================================== */
.lib-eyebrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 28px;padding:0;list-style:none}
@media (min-width:760px){.plates{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}}
.plate{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px 10px 0;border:1.5px solid var(--blaeck);border-radius:3px;background:transparent;color:var(--blaeck);text-align:left;overflow:hidden}
.plate:hover{background:var(--hover)}
.plate .code{font:850 clamp(46px,14.5vw,96px)/.8 var(--f-sign);letter-spacing:-.055em;margin-left:-.04em;padding-top:4px}
.plate .name{font:600 13px/1.2 var(--f-sign)}
.plate .count{font:400 12.5px/1.2 var(--f-type);color:var(--grafit)}
.plate .bar{display:block;height:5px;margin:4px -10px 0;background:var(--rule)}
.plate .bar i{display:block;height:100%;background:var(--blaeck)}
.plate[aria-selected="true"]{background:var(--markor);border-color:var(--markor);color:var(--on-markor)}
.plate[aria-selected="true"] .count{color:var(--on-markor)}
.plate[aria-selected="true"] .bar{background:rgba(0,0,0,.14)}
.plate[aria-selected="true"] .bar i{background:var(--on-markor)}
.plate.empty .code{opacity:.35}

.lib-grid{display:grid;gap:28px}
@media (min-width:960px){.lib-grid{grid-template-columns:minmax(0,1fr) 300px;gap:48px}.lib-aside{order:2}.lib-main{order:1}}
.lib-main{min-width:0}
.lib-aside{display:grid;gap:18px;align-content:start}
.lvl-head h1{font:800 26px/1.15 var(--f-sign);letter-spacing:-.01em}
.lvl-head p{font:400 16px/1.5 var(--f-read);color:var(--grafit);margin-top:6px}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px}
.meter .track{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--gran)}
.continue{display:grid;gap:4px;padding:14px;border:1.5px solid var(--blaeck);border-radius:3px;text-decoration:none;color:var(--blaeck)}
.continue:hover{background:var(--hover)}
/* Today: the single calm entry point of the library */
.today{display:grid;gap:12px;padding:16px;margin:0 0 22px;border:1px solid var(--rule-2);border-radius:12px;background:var(--surface)}
.today p{margin-top:4px;font:400 16px/1.5 var(--f-read);color:var(--blaeck)}
.today-actions{display:flex;flex-wrap:wrap;gap:8px}
@media (min-width:600px){.today{grid-template-columns:minmax(0,1fr) auto;align-items:center}}
.continue b{font:600 19px/1.25 var(--f-read)}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:6px}
.catalog{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:3px 12px;padding:15px 6px 15px 0;border-top:1px solid var(--rule);color:var(--blaeck);text-decoration:none}
.row:hover{background:var(--hover)}
.row .num{grid-row:1 / span 3;font:400 15px/1.6 var(--f-type);color:var(--grafit);padding-left:4px}
.row .sv{font:600 21px/1.25 var(--f-read);letter-spacing:-.005em}
.row .fr{grid-column:2;font:italic 400 15.5px/1.4 var(--f-read);color:var(--grafit)}
.row .meta{grid-column:2 / span 2;font:500 12px/1.5 var(--f-sign);letter-spacing:.04em;color:var(--grafit)}
.row .meta b{font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.status{grid-column:3;grid-row:1;justify-self:end;align-self:start;margin-top:3px;font:700 11.5px/1.2 var(--f-type);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--grafit)}
.status.wip{color:var(--gran)}
.status.read{color:var(--stampel);border:1.5px solid currentColor;border-radius:3px;padding:3px 6px 2px;transform:rotate(-3deg)}
.empty-note{padding:28px 0;font:400 16px/1.6 var(--f-read);color:var(--grafit)}

.foot{padding-block:20px 28px;border-top:1px solid var(--rule);font:400 13px/1.5 var(--f-sign);color:var(--grafit)}

/* Skeleton & states */
.skel{display:block;background:var(--rule);border-radius:3px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.state{max-width:34rem;padding:28px 0;display:grid;gap:12px;justify-items:start}
.state h2{font:800 24px/1.2 var(--f-sign)}
.state p{font:400 16.5px/1.6 var(--f-read)}
.state code{font:400 14px var(--f-type);background:var(--surface);border:1px solid var(--rule);padding:1px 5px;border-radius:2px}

/* =====================================================================
   READER
   ===================================================================== */
.reader{max-width:var(--measure-px,46rem)}
.back{display:inline-flex;align-items:center;gap:4px;font:600 14px var(--f-sign);color:var(--grafit);text-decoration:none;margin:-4px 0 18px -6px;padding:4px 6px}
.back:hover{color:var(--blaeck)}
.r-eyebrow{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:12px}
.r-title{font:700 clamp(31px,7.4vw,46px)/1.1 var(--f-read);font-optical-sizing:auto;letter-spacing:-.015em}
.r-title .w{border-radius:3px}
.r-titlefr{font:italic 400 19px/1.4 var(--f-read);color:var(--grafit);margin-top:8px}
.r-meta{margin-top:14px;font:400 13px/1.5 var(--f-type);color:var(--grafit)}
.r-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:18px 0 6px;padding:10px 0;border-block:1px solid var(--rule)}
.sizer{display:inline-flex;border:1.5px solid var(--blaeck);border-radius:3px;overflow:hidden}
.sizer button{min-width:44px;min-height:36px;border:0;background:transparent;font:700 14px var(--f-sign)}
.sizer button + button{border-left:1.5px solid var(--blaeck)}
.sizer button:hover{background:var(--hover)}
.sizer button:disabled{opacity:.35;cursor:not-allowed}
.r-summary{margin-top:12px;font:400 16.5px/1.6 var(--f-read);max-width:62ch}
.r-grammar{margin-top:14px;display:grid;gap:3px;max-width:62ch}
.r-grammar p{font:400 15.5px/1.55 var(--f-read)}
.cast{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font:500 13.5px/1.4 var(--f-sign)}
.cast a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.cast a:hover span:last-child{text-decoration:underline}
.cast i{width:14px;height:5px;border-radius:3px;background:var(--sp)}
.cast .who{color:var(--sp);font-weight:700}
.notice{display:grid;gap:6px;margin:16px 0 0;padding:12px 14px;border:1.5px dashed var(--rule-2);border-radius:3px;font:400 14.5px/1.5 var(--f-sign)}

.text{margin-top:26px;font:400 var(--read-size)/1.78 var(--f-read);max-width:var(--measure);overflow-wrap:break-word}
.para{margin:0 0 1.05em}
.turn{display:grid;gap:2px;margin:0 0 .9em}
.turn .who{font:700 .62em/1.4 var(--f-sign);letter-spacing:.12em;text-transform:uppercase;color:var(--sp);display:flex;align-items:center;gap:.5em;padding-top:.15em}
.turn .who::before{content:"";width:1.1em;height:.32em;border-radius:.2em;background:var(--sp)}
.turn .para{margin:0}
.turn.narr .para{font-style:italic;color:var(--grafit)}
@media (min-width:760px){
  .turn{grid-template-columns:7.2rem minmax(0,1fr);gap:0 18px}
  .turn .who{justify-content:flex-end;text-align:right;padding-top:.62em}
  .turn .who::before{order:2}
  .turn.narr .para{grid-column:2}
  .dlg-text{max-width:calc(var(--measure) + 8.4rem)}
}
.s{border-radius:3px;transition:background-color .18s}
.s.is-current{background:var(--band);box-shadow:0 0 0 3px var(--band);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sn{position:relative;top:-.62em;display:inline-block;border:0;background:none;padding:0 .28em 0 .12em;margin:0;font:600 .56em/1 var(--f-sign);vertical-align:baseline;color:var(--grafit);font-variant-numeric:tabular-nums}
.sn::after{content:"";position:absolute;inset:-14px -6px}
.sn:hover{color:var(--gran);text-decoration:underline}
.s.is-current .sn{color:var(--gran)}
.w{cursor:pointer;border-radius:2px;transition:background-color .12s}
.w:hover{background:var(--hover);box-shadow:0 0 0 2px var(--hover)}
.w.is-saved{text-decoration:underline dotted var(--stampel);text-decoration-thickness:2px;text-underline-offset:.24em}
.w.is-speaking{transition:none;background:var(--markor);color:var(--on-markor);box-shadow:0 0 0 2px var(--markor)}
.w.is-open{outline:2px solid var(--gran);outline-offset:1px}
.tr{display:none;font:italic 400 .84em/1.5 var(--f-read);color:var(--grafit);margin:.15em 0 .65em}
.tr .ex{display:none;font-style:normal;font-family:var(--f-sign);font-size:.84em;margin-top:.35em}
.tr .ex b{font-weight:700;color:var(--blaeck)}
.tr.is-open{display:block;padding-left:.8em;border-left:2px solid var(--gran)}
.tr.is-open .ex{display:block}
.text.show-tr .s{display:block}
.text.show-tr .tr{display:block}
.text.show-tr .para{margin-bottom:1.3em}
.end-mark{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:30px 0 8px;padding-top:16px;border-top:1.5px solid var(--blaeck)}
.end-mark .slut{font:800 13px/1 var(--f-sign);letter-spacing:.3em;text-transform:uppercase}

/* Quiz */
.quiz{margin-top:44px;max-width:var(--measure);font-size:var(--read-size)}
.quiz-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:8px}
.quiz-head h2{font:800 28px/1.1 var(--f-sign);letter-spacing:-.01em}
.q{padding:20px 0;border-top:1px solid var(--rule)}
.q-n{font:400 13px var(--f-type);color:var(--grafit)}
.q-sv{font:600 1em/1.45 var(--f-read);margin-top:4px}
.q-fr{font:italic 400 .82em/1.45 var(--f-read);color:var(--grafit);margin-top:2px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:2px 8px;width:100%;padding:11px 12px;border:1.5px solid var(--rule-2);border-radius:3px;background:var(--surface);text-align:left;font:400 .88em/1.4 var(--f-read);color:var(--blaeck)}
.opt:hover:not(:disabled){border-color:var(--blaeck)}
.opt .k{font:700 .9em/1.5 var(--f-type);color:var(--grafit)}
.opt .ofr{grid-column:2;font-style:italic;color:var(--grafit);font-size:.92em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.verdict{margin-top:12px;font:400 .85em/1.55 var(--f-read)}
.verdict b{font-family:var(--f-sign);font-size:.92em;letter-spacing:.02em}
.verdict.ok b{color:var(--ok)} .verdict.ko b{color:var(--bad)}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 0;border-top:1.5px solid var(--blaeck)}
.score strong{font:800 30px/1 var(--f-sign)}
.next-link{display:grid;gap:4px;margin-top:28px;padding:16px;border:1.5px solid var(--blaeck);border-radius:3px;text-decoration:none;color:var(--blaeck);max-width:var(--measure)}
.next-link:hover{background:var(--hover)}
.next-link b{font:600 21px/1.25 var(--f-read)}

/* =====================================================================
   PLAYER BAR (fixed bottom, safe-area aware)
   ===================================================================== */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--papper);border-top:1.5px solid var(--blaeck);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player-prog{position:absolute;left:0;right:0;top:-1.5px;height:4px;pointer-events:none}
.player-prog i{display:block;height:100%;width:0;background:var(--gran);transition:width .3s}
.player-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:8px}
.pbtn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--blaeck);flex:none}
.pbtn:hover:not(:disabled){background:var(--hover)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn.play{width:54px;height:54px;background:var(--blaeck);color:var(--papper)}
.pbtn.play:hover:not(:disabled){background:var(--gran);color:var(--on-gran)}
.pbtn.play .ic{width:26px;height:26px}
.player-status{flex:1;min-width:0;display:grid;gap:1px;padding-left:6px}
.ps-main{font:700 14px/1.25 var(--f-sign);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-sub{font:400 12.5px/1.3 var(--f-type);color:var(--grafit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-sub a{color:inherit}
.tools-btn{min-width:64px;height:40px;padding:0 10px;border:1.5px solid var(--blaeck);border-radius:3px;background:transparent;font:700 14px var(--f-type);flex:none}
.tools-btn:hover,.tools-btn[aria-expanded="true"]{background:var(--hover)}
.tools{max-width:1140px;margin:8px auto 2px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;padding:12px 0 4px;border-top:1px solid var(--rule)}
.rate{display:flex;align-items:center;gap:10px;font:600 14px var(--f-sign)}
.rate input{width:min(220px,46vw);accent-color:var(--gran)}
.rate output{font:700 14px var(--f-type);min-width:3.4em}

/* =====================================================================
   WORD POPOVER — bottom sheet on phones, anchored card on wide screens
   ===================================================================== */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.pop{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--surface);color:var(--blaeck);border-top:1.5px solid var(--blaeck);border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:sheet .2s ease-out}
.pop::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--rule-2);margin:0 auto 10px}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}}
@media (min-width:760px){
  .pop{left:auto;right:auto;bottom:auto;width:380px;max-height:min(70vh,560px);border:1.5px solid var(--blaeck);border-radius:4px;padding:16px 18px 18px;animation:none}
  .pop::before{display:none}
  .scrim.phone-only{display:none}
}
.pop-head{display:flex;align-items:flex-start;gap:10px}
.pop-head .hw{flex:1;min-width:0}
.pop-form{font:700 30px/1.1 var(--f-read);overflow-wrap:anywhere}
.pop-pos{font:italic 400 16px var(--f-read);color:var(--grafit);margin-left:6px}
.pop-lemma{margin-top:4px;font:400 15px/1.4 var(--f-read);color:var(--grafit)}
.pop-lemma b{color:var(--blaeck);font-weight:700}
.pop-x{width:38px;height:38px;margin:-4px -8px 0 0}
.pop-fr{margin-top:12px;font:500 20px/1.35 var(--f-read)}
.pop-g{margin-top:8px;font:400 13.5px/1.5 var(--f-sign);color:var(--grafit)}
.pop-expr{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);display:grid;gap:6px}
.pop-expr p{font:400 15px/1.45 var(--f-read)}
.pop-expr b{font-weight:700}
.pop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pop-actions .btn{min-height:44px;justify-content:flex-start}
.pop-actions .btn.saved{color:var(--stampel);border-color:var(--stampel)}

/* =====================================================================
   MES MOTS & REVIEW
   ===================================================================== */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:22px}
.page-head h1{font:850 clamp(34px,8vw,52px)/1 var(--f-sign);letter-spacing:-.03em}
.page-head p{margin-top:8px;font:400 16px/1.5 var(--f-read);color:var(--grafit)}
.w-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 0;border-block:1px solid var(--rule);margin-bottom:4px}
.search{flex:1 1 220px;min-width:0;height:42px;padding:0 14px;border:1px solid var(--rule-2);border-radius:10px;background:var(--surface);color:var(--blaeck);font:400 15px var(--f-sign);box-shadow:0 1px 2px rgba(74,31,53,.06);transition:border-color .15s ease,box-shadow .15s ease}
.select{height:42px;padding:0 12px;border:1px solid var(--rule-2);border-radius:10px;background:var(--surface);color:var(--blaeck);font:500 14px var(--f-sign);box-shadow:0 1px 2px rgba(74,31,53,.06);cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease}
.search:hover,.select:hover{border-color:var(--grafit)}
.search:focus,.select:focus,.chat-input:focus{outline:none;border-color:var(--gran);box-shadow:0 0 0 3px rgba(162,63,107,.22)}
.wlist{list-style:none;margin:0;padding:0}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:16px 0;border-bottom:1px solid var(--rule)}
.wrow-main{min-width:0;display:grid;gap:3px}
.wrow .lemma{font:700 22px/1.2 var(--f-read)}
.wrow .pos{font:italic 400 15px var(--f-read);color:var(--grafit)}
.wrow .wfr{font:400 16.5px/1.45 var(--f-read)}
.wrow .ex{margin-top:4px;font:400 15.5px/1.55 var(--f-read);max-width:62ch}
.wrow .ex .exfr{display:block;font-style:italic;color:var(--grafit);font-size:.94em}
.wctx{display:grid;gap:4px;margin-top:6px}.wctx .label{margin-bottom:0}
.chat-log{display:grid;gap:12px;max-height:60vh;overflow:auto;padding:4px 0;margin:12px 0}
.chat-msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.chat-msg.user p{color:var(--grafit)}
.chat-form{display:grid;gap:8px;grid-template-columns:1fr auto;align-items:end}
.chat-input{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--rule-2);border-radius:10px;background:var(--surface);color:inherit;resize:vertical;box-shadow:0 1px 2px rgba(74,31,53,.06);transition:border-color .15s ease,box-shadow .15s ease}
.chat-input:hover{border-color:var(--grafit)}
mark.hl{background:var(--markor);color:var(--on-markor);border-radius:2px;box-shadow:0 0 0 1.5px var(--markor)}
.wrow .wmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:6px;font:400 13px var(--f-type);color:var(--grafit)}
.wrow .wmeta a{color:inherit}
.boxes{display:inline-flex;gap:3px;vertical-align:middle}
.boxes i{width:9px;height:9px;border:1.5px solid var(--stampel);border-radius:1px}
.boxes i.on{background:var(--stampel)}
.due{color:var(--stampel);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wrow-actions{display:flex;gap:4px;align-items:flex-start}

.review{max-width:40rem}
.card{position:relative;margin-top:8px;padding:26px 22px 22px;border:1.5px solid var(--blaeck);border-radius:4px;background:var(--surface);min-height:300px;display:flex;flex-direction:column;gap:14px}
.card::after{content:"";position:absolute;left:50%;bottom:10px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:1.5px solid var(--rule-2);background:var(--papper)}
.card .c-top{display:flex;justify-content:space-between;gap:10px}
.card .c-lemma{font:700 clamp(36px,10vw,54px)/1.05 var(--f-read);letter-spacing:-.01em;overflow-wrap:anywhere}
.card .c-ex{font:400 18px/1.6 var(--f-read)}
.card .c-fr{font:500 24px/1.35 var(--f-read);padding-top:14px;border-top:1px solid var(--rule)}
.card .c-g{font:400 14px/1.5 var(--f-sign);color:var(--grafit)}
.card .c-exfr{font:italic 400 16px/1.5 var(--f-read);color:var(--grafit)}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.card-actions .btn{flex:1 1 150px;min-height:50px;font-size:15px}
.review-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

/* =====================================================================
   LECTEURS (voices)
   ===================================================================== */
.voices{max-width:46rem;display:grid;gap:34px}
.vsec h2{font:800 20px/1.2 var(--f-sign);margin-bottom:4px}
.vsec > p{font:400 16px/1.55 var(--f-read);color:var(--grafit);max-width:60ch}
.roles{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--rule)}
.role{display:grid;grid-template-columns:7.5rem minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.role > b{font:700 14px var(--f-sign);display:flex;align-items:center;gap:8px}
.role > b i{width:14px;height:5px;border-radius:3px;background:var(--sp)}
.role .select{width:100%;min-width:0}
.role small{grid-column:2 / span 2;font:400 12.5px var(--f-type);color:var(--grafit);margin-top:-4px}
@media (max-width:520px){.role{grid-template-columns:minmax(0,1fr) auto}.role > b{grid-column:1 / span 2}.role small{grid-column:1 / span 2}}
.vlist{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--rule)}
.vlist li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.vlist .vn{flex:1;min-width:0}
.vlist .vn b{display:block;font:600 15.5px/1.3 var(--f-sign);overflow-wrap:anywhere}
.vlist .vn span{font:400 12.5px var(--f-type);color:var(--grafit)}
.help{padding:18px;border:1.5px solid var(--blaeck);border-radius:4px;background:var(--surface);display:grid;gap:10px}
.help h2{font:800 20px/1.2 var(--f-sign)}
.help p,.help li{font:400 16px/1.55 var(--f-read)}
.help ul{margin:0;padding-left:1.1em;display:grid;gap:8px}
.help b{font-weight:700}

/* =====================================================================
   CONJUGAISON — verbes des textes et du jeu : deux sections (réguliers,
   irréguliers), chacune découpée par classe ; une ligne par verbe.
   ===================================================================== */
#conj-q{height:44px}
.cj-head-note{display:grid;gap:6px;margin-top:4px}
.cj-head-note p{font:400 15px/1.5 var(--f-read);color:var(--grafit);max-width:64ch}
.cj-sec{display:grid;gap:6px;margin-top:22px}
.cj-sec > h2{font:800 clamp(24px,6vw,30px)/1.15 var(--f-sign);padding-top:14px;border-top:1px solid var(--rule)}
.cj-sec > .cj-intro{font:400 15px/1.5 var(--f-read);color:var(--grafit);max-width:64ch}
.cj-sub{display:grid;gap:4px;margin-top:14px}
.cj-sub h3{font:700 17px/1.3 var(--f-sign)}
.cj-count{font:400 13px var(--f-type);color:var(--grafit)}
.cj-desc{font:400 13.5px/1.5 var(--f-read);color:var(--grafit)}
.cj-list{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule)}
.cj-row{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule)}
.cj-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-width:0}
.cj-head b{font:700 19px/1.2 var(--f-read);overflow-wrap:anywhere}
.cj-fr{font:400 15px/1.35 var(--f-read)}
.cj-src{font:400 12px/1.3 var(--f-type);color:var(--grafit)}
.cj-forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 12px;margin:0}
.cj-f{min-width:0}
.cj-f dt{font:600 11px/1.2 var(--f-sign);letter-spacing:.06em;text-transform:uppercase;color:var(--grafit)}
.cj-f dd{margin:2px 0 0;font:500 16px/1.3 var(--f-read);overflow-wrap:anywhere}
.cj-none{color:var(--grafit)}
@media (max-width:520px){.cj-forms{grid-template-columns:repeat(2,minmax(0,1fr))}}
.conj-filter{margin-top:8px}
.conj-filter:empty{display:none}
.conj-filter .chip{min-height:44px;display:inline-flex;align-items:center;max-width:100%;text-align:left}


/* =====================================================================
   JEU — « Match the pairs » : deux colonnes de fiches, suédois à
   gauche (filet bleu), français à droite (filet violet tampon).
   ===================================================================== */
.game{max-width:52rem}
.g-setup{display:grid;gap:18px;padding:16px 0 4px;border-top:1px solid var(--rule)}
.g-field{display:grid;gap:8px;min-width:0}
.g-field .select{width:100%;max-width:34rem;min-width:0}
.g-go{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.g-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:12px 0;border-block:1px solid var(--rule)}
.g-src{min-width:0;font:600 15px/1.35 var(--f-sign);overflow-wrap:anywhere}
.g-count{display:flex;flex-wrap:wrap;gap:6px 16px;font:400 13px/1.2 var(--f-type);color:var(--grafit)}
.g-count b{font:700 18px/1 var(--f-type);color:var(--blaeck);margin-left:4px}
.g-msg{min-height:3em;margin:10px 0 12px;font:400 15.5px/1.5 var(--f-read);color:var(--grafit)}
.g-msg b{color:var(--blaeck)}
.m-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
@media (min-width:560px){.m-board{gap:10px 18px}}
.m-colwrap{min-width:0}
.m-head{margin:0 0 8px;font:600 10.5px/1.2 var(--f-sign);letter-spacing:.12em;text-transform:uppercase;color:var(--grafit)}
.m-col{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-auto-rows:minmax(62px,auto)}
.m-col li{min-width:0;display:flex}
.m-empty{flex:1;border:1.5px dashed var(--rule);border-radius:3px}
.m-word{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;width:100%;min-width:0;min-height:62px;padding:8px 10px 8px 12px;border:1.5px solid var(--blaeck);border-radius:3px;background:var(--surface);color:var(--blaeck);text-align:left;overflow:hidden;transition:background-color .15s ease,border-color .15s ease}
.m-word:hover{background:var(--hover)}
.m-word .m-t{font:600 16px/1.25 var(--f-read);max-width:100%;overflow-wrap:anywhere;hyphens:auto}
.m-word .m-l{font:400 12px/1.3 var(--f-type);color:var(--grafit);overflow-wrap:anywhere}
.m-word.m-sv{box-shadow:inset 4px 0 0 var(--sp-b)}
.m-word.m-fr{box-shadow:inset 4px 0 0 var(--stampel)}
.m-word.m-fr .m-t{font-weight:500;font-style:italic}
.m-word[aria-pressed="true"]{background:var(--markor);border-color:var(--markor);color:var(--on-markor);box-shadow:inset 4px 0 0 var(--on-markor)}
.m-word[aria-pressed="true"] .m-l{color:var(--on-markor)}
.m-word.is-miss{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad),inset 0 0 0 1.5px var(--bad);animation:gshake .32s ease-in-out}
.m-word.is-match{border-color:var(--ok);background:var(--band);color:var(--blaeck);box-shadow:inset 4px 0 0 var(--ok);animation:mout .38s ease-in forwards;cursor:default}
.m-word.is-new{animation:min .28s ease-out}
/* Jeu « Image et mot » */
.pic-stage{display:grid;place-items:center;margin:20px 0 6px}
.pic-img{font-size:min(32vw,140px);line-height:1.1;padding:14px 0;user-select:none}
.pic-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pic-opt{display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 12px;border:1.5px solid var(--blaeck);border-radius:3px;background:var(--surface);color:var(--blaeck);font:600 19px/1.2 var(--f-read);text-align:left;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.pic-opt:hover{background:var(--hover)}
.pic-opt:focus-visible{outline:3px solid var(--markor);outline-offset:2px}
.pic-opt[aria-disabled="true"]{cursor:default}
.pic-opt[aria-disabled="true"]:hover{background:var(--surface)}
.pic-opt.is-right,.pic-opt.is-right:hover{border-color:var(--ok);background:var(--band);box-shadow:inset 5px 0 0 var(--ok)}
.pic-opt.is-wrong,.pic-opt.is-wrong:hover{border-color:var(--bad);background:var(--surface);box-shadow:inset 5px 0 0 var(--bad),inset 0 0 0 1.5px var(--bad)}
.pic-key{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid var(--rule-2);border-radius:4px;font:700 12px/1 var(--f-type);color:var(--grafit)}
.pic-word{min-width:0;overflow-wrap:anywhere}
@media (max-width:420px){.pic-opts{grid-template-columns:1fr}}
.g-msg.is-wrong{color:var(--bad)}
@keyframes mout{60%{opacity:1}to{opacity:0;transform:scale(.92)}}
@keyframes min{from{opacity:0;transform:translateY(6px)}}
@keyframes gshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.g-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.g-recap{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule);width:100%;max-width:34rem}
.g-recap li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--rule);font:400 15.5px/1.4 var(--f-read)}
.g-recap li b{font-weight:600;overflow-wrap:anywhere}
.g-recap li small{display:block;font:400 12px/1.3 var(--f-type);color:var(--grafit)}
.g-recap li span{font-style:italic;color:var(--grafit);overflow-wrap:anywhere}
/* Jeu « Situations » : scène, contexte, demande en gras, puis quatre phrases suédoises (.pic-opt réutilisé) */
.sit-card{display:grid;gap:6px;margin:18px 0 0;padding:4px 0 0;min-width:0}
.sit-scene{margin:0;font:600 11px/1.2 var(--f-sign);letter-spacing:.12em;text-transform:uppercase;color:var(--grafit);overflow-wrap:anywhere}
.sit-context{margin:0;font:400 16px/1.5 var(--f-read);color:var(--blaeck);overflow-wrap:anywhere}
.sit-request{margin:4px 0 14px;font:600 clamp(20px,5.4vw,27px)/1.25 var(--f-read);color:var(--blaeck);overflow-wrap:anywhere}
.sit-opts .pic-opt{font-size:17px;line-height:1.35;align-items:flex-start;padding:10px 12px}
.sit-opts .pic-key{margin-top:1px}
.sit-reveal{display:grid;gap:8px;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--rule);min-width:0}
.sit-sv{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0;font:600 19px/1.35 var(--f-read);color:var(--blaeck);overflow-wrap:anywhere}
.sit-words{min-width:0}
.sit-words .w{font:inherit;color:inherit;background:none;border:0;padding:2px 2px;margin:0;display:inline}
@media (max-width:759px){.sit-words .w{display:inline-block;min-height:44px;padding:11px 2px;line-height:22px;box-sizing:border-box}}
.sit-fr,.sit-style{margin:0;font:400 15.5px/1.5 var(--f-read);color:var(--grafit);overflow-wrap:anywhere}
.sit-notice{margin:14px 0 0;font:400 15px/1.5 var(--f-read);color:var(--grafit);overflow-wrap:anywhere}
.sit-fr b,.sit-style b{font-weight:600;color:var(--blaeck)}
/* Situations setup: level checkboxes styled as chips (touch target 44 px, visible focus on the chip) */
.sit-lv-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.sit-levels{align-items:center}
.sit-lv{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:6px 14px;cursor:pointer;user-select:none}
.sit-lv input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.sit-lv.is-on{background:var(--blaeck);border-color:var(--blaeck);color:var(--papper)}
.sit-lv:focus-within{outline:2px solid var(--gran);outline-offset:2px}
.sit-lv-tools .btn{min-height:44px}
#s-counts .chip{display:inline-flex;align-items:center;min-height:44px}

/* =====================================================================
   TOASTS
   ===================================================================== */
.toasts{position:fixed;z-index:60;left:0;right:0;bottom:calc(var(--toast-off,16px) + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view-reader .toasts{--toast-off:calc(var(--bar-h) + 14px)}

}
</style>
</head>
<body>

<header class="app-head wrap">
  <div class="inner">

      <a href="#lecteurs" data-nav="lecteurs">Voices</a>
      <a href="#jeu" data-nav="jeu">Games</a>

    </nav>

<main id="view" class="wrap" tabindex="-1">
  <div class="inner"><p class="empty-note">Loading…</p></div>
</main>

<div id="player" class="player" hidden>

  <div class="player-in">

<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   0. CONSTANTS
   ===================================================================== */
const LEVELS = ["A1", "A2", "B1", "B2", "C1", "C2"];
const LEVEL_FR = { A1: "Discovery", A2: "Survival", B1: "Threshold", B2: "Advanced", C1: "Independent", C2: "Mastery" };
const LEVEL_HINT = {
  A1: "Present tense, very common words, short sentences: introducing yourself, family, meals.",
  A2: "Past and perfect tenses, modal verbs, short subordinate clauses: everyday situations.",
  B1: "All common tenses, opinions, plans and reported speech.",
  B2: "Abstract topics, passive voice, nuanced connectors and idioms.",
  C1: "Complex syntax, varied registers, figurative language and argument.",
  C2: "Literary and journalistic richness, irony, rare words and allusions."
};
const TYPES = {
  vardag: { one: "Everyday life", many: "Everyday life & culture" },
  dialog: { one: "Dialogue", many: "Dialogues" },
  berattelse: { one: "Story", many: "Stories" },
  artikel: { one: "Article", many: "Articles" }
};
const RATE_DEFAULT = { A1: 0.8, A2: 0.85, B1: 0.9, B2: 1, C1: 1, C2: 1 };
const ROLES = [
  { key: "N", label: "Narrator", color: "var(--sp-n)", test: "Hej! Jag läser texterna högt för dig." },
  { key: "A", label: "Voice 1", color: "var(--sp-a)", test: "Hej! Jag är den första rösten i samtalen." },
  { key: "B", label: "Voice 2", color: "var(--sp-b)", test: "Och jag är den andra rösten." },
  { key: "C", label: "Voice 3", color: "var(--sp-c)", test: "Och jag är den tredje." }
];
const SPEAKER_COLOR = { A: "var(--sp-a)", B: "var(--sp-b)", C: "var(--sp-c)", N: "var(--sp-n)" };
const LEITNER_DAYS = [0, 0, 1, 3, 7, 16];   // index = Leitner box 1…5
const WPM = 150;                               // TTS words per minute at rate 1
const ID_RE = /^(a1|a2|b1|b2|c1|c2)-\d{2}$/;
const FONT_MIN = 16, FONT_MAX = 28;
const FEMALE_HINTS = ["alva", "klara", "sofie", "hillevi", "hedvig", "astrid", "google svenska", "female", "kvinna", "woman"];
const MALE_HINTS = ["oskar", "bengt", "mattias", "male", "man)"];
// SPEC tokenizer — must stay identical to tools/validate.py
const TOKEN_RE = /[\p{L}\p{M}]+(?:-[\p{L}\p{M}]+)*/gu;
const reduceMotion = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } })();

/* =====================================================================
   1. SMALL HELPERS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const str = (v) => (typeof v === "string" ? v : "");
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/** Build an element: h("p", {class, text, onclick, ...attrs}, ...children). */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : String(kid));
  }
  return el;
}

const ICONS = {
  play: "M8 5.2v13.6L19 12z",
  pause: "M7 5h3.6v14H7zm6.4 0H17v14h-3.6z",
  prev: "M6 5h2.2v14H6zm13.5 0v14L9.2 12z",
  next: "M15.8 5H18v14h-2.2zM4.5 5v14l10.3-7z",
  speaker: "M4 9v6h4l5 4V5L8 9zm11.5-1.6v9.2a5 5 0 0 0 0-9.2z",
  plus: "M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z",
  check: "M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6L20.1 8.4l-1.4-1.4z",
  close: "M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z",
  back: "M15.4 6.6 14 5.2 7.2 12l6.8 6.8 1.4-1.4L10 12z",
  from: "M3 6h9v2H3zm0 5h9v2H3zm0 5h6v2H3zm11-6v10l7-5z",
  lang: "M4 5h10v2h-3.5c-.5 2.2-1.6 4.1-3 5.6 1 .8 2.1 1.4 3.3 1.8l-.7 1.9c-1.5-.5-2.9-1.3-4.1-2.3-1.2 1-2.6 1.8-4.1 2.3L1.2 14.4c1.2-.4 2.3-1 3.3-1.8C3.5 11.5 2.7 10.3 2.2 9h2.2c.4.9 1 1.7 1.6 2.4 1-1.1 1.8-2.6 2.2-4.4H4zm11.8 5h2.4l4 10h-2.3l-.9-2.4h-4l-.9 2.4h-2.3zm1.2 2.8-1.3 3.4h2.6z",
  trash: "M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"
};
function icon(name) {
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("class", "ic");
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", ICONS[name] || "");
  s.append(p);
  return s;
}

/* Dates as local calendar days "YYYY-MM-DD" (Leitner due dates). */
const pad2 = (n) => String(n).padStart(2, "0");
const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => dayStr();
function addDays(day, n) {
  const [y, m, d] = day.split("-").map(Number);
  return dayStr(new Date(y, m - 1, d + n));
}
function fmtDay(day) {
  try {
    const [y, m, d] = day.split("-").map(Number);
    return new Intl.DateTimeFormat("fr-BE", { day: "numeric", month: "short" }).format(new Date(y, m - 1, d));
  } catch { return day; }
}
const fmtRate = (r) => String(Math.round(r * 100) / 100).replace(".", ",") + "×";
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
const fold = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function tokenize(text) {
  const out = [];
  for (const m of String(text).matchAll(TOKEN_RE)) {
    out.push({ start: m.index, end: m.index + m[0].length, text: m[0], key: m[0].toLowerCase() });
  }
  return out;
}

/* =====================================================================
   2. STATE & SETTINGS
   S = synced state (settings, progress, saved words). UI = per-browser
   conveniences (selected level, filters) kept in localStorage only.
   ===================================================================== */
const DEFAULT_SETTINGS = { voices: { N: "", A: "", B: "", C: "" }, rates: {}, fontSize: 20, showTr: false };
const S = { settings: structuredCloneSafe(DEFAULT_SETTINGS), settingsT: 0, progress: {}, words: {} };
const UI = { level: "A1", type: "all", wSort: "recent", wLevel: "all", wQuery: "", quizFr: false, levelChosen: false, gLevel: "", gSource: "all", gCount: 10,
  sitLevels: ["A1"], sitThemes: [], sitCount: "all", sitLang: "fr" };

function structuredCloneSafe(o) { return JSON.parse(JSON.stringify(o)); }

function normSettings(raw) {
  const s = structuredCloneSafe(DEFAULT_SETTINGS);
  if (!isObj(raw)) return s;
  if (isObj(raw.voices)) for (const k of ["N", "A", "B", "C"]) s.voices[k] = str(raw.voices[k]);
  if (isObj(raw.rates)) for (const lv of LEVELS) {
    const r = Number(raw.rates[lv]);
    if (r >= 0.5 && r <= 1.5) s.rates[lv] = r;
  }
  const f = Number(raw.fontSize);
  if (f >= FONT_MIN && f <= FONT_MAX) s.fontSize = Math.round(f);
  s.showTr = raw.showTr === true;
  return s;
}
function normProgress(p) {
  if (!isObj(p)) return null;
  const out = { t: Number(p.t) || 0 };
  if (p.read === true) out.read = true;
  if (isObj(p.quiz) && Number.isFinite(p.quiz.c) && Number.isFinite(p.quiz.n)) out.quiz = { c: p.quiz.c, n: p.quiz.n };
  if (Array.isArray(p.ans)) out.ans = p.ans.map((a) => (Number.isInteger(a) ? a : -1));
  if (Number.isInteger(p.pos) && p.pos >= 0) out.pos = p.pos;
  if (Number(p.seen) > 0) out.seen = Number(p.seen);
  return out;
}
function normWord(w) {
  if (!isObj(w)) return null;
  if (w.del) return { del: true, t: Number(w.t) || 0 };
  const box = Number.isInteger(w.box) ? clamp(w.box, 1, 5) : 1;
  return {
    lemma: str(w.lemma), form: str(w.form), fr: str(w.fr), pos: str(w.pos), g: str(w.g),
    ex: { sv: str(w.ex && w.ex.sv), fr: str(w.ex && w.ex.fr) },
    textId: str(w.textId), level: LEVELS.includes(w.level) ? w.level : "",
    box, due: /^\d{4}-\d{2}-\d{2}$/.test(w.due) ? w.due : today(),
    added: Number(w.added) || 0, t: Number(w.t) || 0
  };
}
function normMap(items, fn) {
  const out = {};
  if (isObj(items)) for (const [k, v] of Object.entries(items)) { const n = fn(v); if (n) out[k] = n; }
  return out;
}

/* Mutators — every change goes through these so it is persisted. */
function changeSettings(mut) {
  const before = JSON.stringify(S.settings);
  mut(S.settings);
  if (JSON.stringify(S.settings) === before) return;
  S.settingsT = Date.now();
  Persist.changed("settings");
}
function setProgress(id, patch) {
  const cur = S.progress[id] || { t: 0 };
  const next = { ...cur, ...patch };
  for (const k of Object.keys(next)) if (next[k] === undefined) delete next[k];
  const a = JSON.stringify({ ...cur, t: 0 }), b = JSON.stringify({ ...next, t: 0 });
  if (a === b) return;
  next.t = Date.now();
  S.progress[id] = next;
  Persist.changed("progress");
}
function putWord(key, rec) {
  S.words[key] = { ...rec, t: Date.now() };
  Persist.changed("words", key);
  updateBadge();
}
const liveWords = () => Object.entries(S.words).filter(([, w]) => w && !w.del);
const isSaved = (key) => !!(S.words[key] && !S.words[key].del);
/** The situations (sentences) a saved word was met in: { sv, fr, textId } each. Older records only have ex. */
function contextsOf(w) {
  if (!w) return [];
  if (Array.isArray(w.ctx) && w.ctx.length) return w.ctx;
  return w.ex && w.ex.sv ? [{ sv: str(w.ex.sv), fr: str(w.ex.fr), textId: w.textId }] : [];
}
/** Adds a new situation to a saved word, keeping the ones it already has. Returns false when that sentence is already one of them. */
function addContext(key, sv, fr, textId) {
  const w = S.words[key];
  if (!w || w.del || !sv) return false;
  const list = contextsOf(w);
  if (list.some((c) => c.sv === sv)) return false;
  putWord(key, { ...w, ctx: [...list, { sv, fr: str(fr), textId: str(textId) }] });
  return true;
}
const dueCount = () => { const d = today(); return liveWords().filter(([, w]) => w.due <= d).length; };
function rateFor(level) { return S.settings.rates[level] || RATE_DEFAULT[level] || 1; }
function saveUI() { Local.write("ui", UI); }

/* =====================================================================
   3. PERSISTENCE
   Local = localStorage cache (try/catch, may be absent → memory only).
   Remote = `db` capability, private per viewer under data/users/<uid>/:
     settings · progress · words-0 … words-7 (words sharded so each doc
     stays far below the 256 KiB limit). Each record carries `t` (ms) and
     merges last-writer-wins; deleted words are kept as {del:true,t}
     tombstones so a removal on one device is not resurrected by another.
   Writes: only on change, debounced, one in flight per document.
   ===================================================================== */
const LS = "svl1:";
const Local = {
  ok: (() => { try { const k = LS + "probe"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch { return false; } })(),
  read(name) {
    if (!this.ok) return null;
    try { const s = localStorage.getItem(LS + name); return s ? JSON.parse(s) : null; } catch { return null; }
  },
  write(name, obj) {
    if (!this.ok) return;
    try { localStorage.setItem(LS + name, JSON.stringify(obj)); } catch { /* quota or blocked: memory only */ }
  }
};

const SHARDS = 8;
function shardOf(key) {
  let x = 2166136261;
  for (let i = 0; i < key.length; i++) { x ^= key.charCodeAt(i); x = Math.imul(x, 16777619); }
  return "words-" + ((x >>> 0) % SHARDS);
}

const Persist = {
  timer: 0,
  dirty: new Set(),
  changed(kind, key) {
    this.dirty.add(kind);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.saveLocal(), 250);
    Remote.schedule(kind === "words" ? shardOf(key) : kind, kind === "progress" ? 4000 : 1500);
  },
  saveLocal() {
    clearTimeout(this.timer);
    if (this.dirty.has("settings")) Local.write("settings", { t: S.settingsT, data: S.settings });
    if (this.dirty.has("progress")) Local.write("progress", { items: S.progress });
    if (this.dirty.has("words")) Local.write("words", { items: S.words });
    this.dirty.clear();
  },
  loadLocal() {
    const ls = Local.read("settings");
    if (ls && ls.data) { S.settings = normSettings(ls.data); S.settingsT = Number(ls.t) || 0; }
    const lp = Local.read("progress");
    if (lp) S.progress = normMap(lp.items, normProgress);
    const lw = Local.read("words");
    if (lw) S.words = normMap(lw.items, normWord);
    const lu = Local.read("ui");
    if (isObj(lu)) {
      if (LEVELS.includes(lu.level)) { UI.level = lu.level; UI.levelChosen = !!lu.levelChosen; }
      if (lu.type === "all" || TYPES[lu.type]) UI.type = lu.type;
      if (lu.wSort === "recent" || lu.wSort === "alpha") UI.wSort = lu.wSort;
      if (lu.wLevel === "all" || LEVELS.includes(lu.wLevel)) UI.wLevel = lu.wLevel;
      UI.quizFr = lu.quizFr === true;
      if (LEVELS.includes(lu.gLevel)) UI.gLevel = lu.gLevel;
      if (lu.gSource === "all" || ID_RE.test(str(lu.gSource))) UI.gSource = lu.gSource;
      if ([10, 20, 30, 40, 50].includes(lu.gCount)) UI.gCount = lu.gCount;
      if (Array.isArray(lu.sitLevels)) UI.sitLevels = SITUATIONS_LEVELS.filter((lv) => lu.sitLevels.includes(lv));
      // Themes are checkboxes: known keys only. A saved empty list (« Aucun ») stays empty.
      // Only an absent or non-array value gives all themes back; an older single choice (sitTheme: one key) is read as the same choice.
      const themeKeys = SITUATIONS_THEMES.map(([k]) => k);
      if (Array.isArray(lu.sitThemes)) UI.sitThemes = themeKeys.filter((k) => lu.sitThemes.includes(k));
      else if (themeKeys.includes(lu.sitTheme)) UI.sitThemes = [lu.sitTheme];
      else UI.sitThemes = themeKeys.slice();
      if (SITUATIONS_COUNTS.includes(lu.sitCount)) UI.sitCount = lu.sitCount;
      // language of the scene and request: "fr" (default) or "sv"; any other saved value is French
      if (lu.sitLang === "fr" || lu.sitLang === "sv") UI.sitLang = lu.sitLang;
    }
  },
  flushAll() { this.saveLocal(); Remote.flushAll(); }
};

const Remote = {
  status: "off",          // off · connecting · on · readonly
  col: null,
  timers: new Map(), inflight: new Set(), again: new Set(), last: new Map(), retries: new Map(),

  body(name) {
    if (name === "settings") return { v: 1, t: S.settingsT, data: S.settings };
    if (name === "progress") return { v: 1, items: S.progress };
    const items = {};
    for (const [k, w] of Object.entries(S.words)) if (shardOf(k) === name) items[k] = w;
    return { v: 1, items };
  },
  schedule(name, delay = 1500) {
    if (this.status !== "on") return;
    clearTimeout(this.timers.get(name));
    this.timers.set(name, setTimeout(() => this.flush(name), delay));
  },
  flushAll() { for (const name of [...this.timers.keys()]) { clearTimeout(this.timers.get(name)); this.flush(name); } },
  async flush(name) {
    this.timers.delete(name);
    if (this.status !== "on") return;
    if (this.inflight.has(name)) { this.again.add(name); return; }
    const body = this.body(name);
    const json = JSON.stringify(body);
    if (this.last.get(name) === json) return;           // unchanged: no write
    this.inflight.add(name);
    try {
      await this.col.doc(name).set(body);
      this.last.set(name, json);
      this.retries.delete(name);
    } catch (e) {
      const code = e && e.code;
      if (code === "unavailable" || code === "resource_exhausted") {
        const n = (this.retries.get(name) || 0) + 1;
        this.retries.set(name, n);
        if (n <= 3) setTimeout(() => this.schedule(name, 0), 1200 * n + Math.random() * 1500);
      } else if (code === "quota_exceeded") {
        toast("Account storage is full: your changes stay in this browser.");
      } else {
        this.status = "readonly";   // invalid_argument (no write access), revoked, not_granted…
        renderSyncNote();
      }
    } finally {
      this.inflight.delete(name);
      if (this.again.delete(name)) this.schedule(name, 300);
    }
  },

  /** Resolve db + user without ever blocking first paint; merge remote into local. */
  async connect() {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return;
    this.status = "connecting";
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch { /* treat as absent */ }
    let uid = null;
    if (user) { try { uid = await user.id(); } catch { uid = null; } }
    if (!db || !uid) { this.status = "off"; renderSyncNote(); return; }
    let col, snap;
    try {
      col = db.collection("data/users/" + uid);
      snap = await col.get();
    } catch (e) {
      if (e && e.code === "unavailable" && !this._retried) {
        this._retried = true;
        this.status = "off";
        setTimeout(() => this.connect(), 1500 + Math.random() * 1500);
        return;
      }
      this.status = "off"; renderSyncNote(); return;
    }
    try {
      const remote = {};
      for (const d of snap.docs || []) if (d.exists) remote[d.id] = d.data() || {};
      this.col = col;
      const { toWrite, localChanged } = mergeRemote(remote);
      this.status = "on";
      for (const name of ["settings", "progress", ...Array.from({ length: SHARDS }, (_, i) => "words-" + i)]) {
        if (!toWrite.has(name)) this.last.set(name, JSON.stringify(this.body(name)));
      }
      for (const name of toWrite) this.schedule(name, 600);
      if (localChanged) { Persist.dirty.add("settings").add("progress").add("words"); Persist.saveLocal(); onStateMerged(); }
      renderSyncNote();
    } catch (e) {
      // Unreadable remote data or merge failure: stop syncing, keep working from local storage.
      this.status = "off";

/** Append text as plain text nodes + clickable word spans. */
function appendTokens(parent, text, sIdx, out) {
  let pos = 0;
  for (const tk of tokenize(text)) {
    if (tk.start > pos) parent.append(text.slice(pos, tk.start));
    const el = h("span", { class: "w", role: "button", tabindex: "-1", "data-s": sIdx, "data-t": out.length, text: tk.text });
    tk.el = el;
    out.push(tk);
    parent.append(el);
    pos = tk.end;
  }
  if (pos < text.length) parent.append(text.slice(pos));
}

}

      exprs.map((e) => h("p", null, h("b", { lang: "sv", text: e.sv }), " — " + str(e.fr)))) : null,

function positionPop() {

function toggleSave(tk, g, sent, formule) {

  if (isSaved(cur)) {
    const prev = S.words[cur];
    putWord(cur, { del: true });
    toast(`“${prev.lemma || tk.text}” removed from My words.`, { label: "Undo", run: () => { putWord(cur, { ...prev }); refreshSavedMarks(); } });
  } else if (formule) {
    putWord(formule.key, {
      lemma: formule.sv, form: tk.text, fr: formule.fr, pos: "formule", g: "",
      ex: { sv: sent.sv, fr: sent.fr }, textId: R.id, level: R.t.level, box: 1, due: today(), added: Date.now()
    });
    toast(`“${formule.sv}” added to My words (full phrase).`);
  } else {
    const wkey = wordKeyFor(tk.key);
    const old = S.words[wkey];
    putWord(wkey, {
      lemma: (g && str(g.l)) || tk.text, form: tk.text, fr: (g && str(g.fr)) || "", pos: (g && str(g.pos)) || "", g: (g && str(g.g)) || "",

  }

}

function buildQuiz(t, prog) {
  const n = t.questions.length;
  R.answers = Array.from({ length: n }, (_, i) => (prog.ans && Number.isInteger(prog.ans[i]) && prog.ans[i] < t.questions[i].options.length ? prog.ans[i] : -1));

  const frSwitch = h("label", { class: "switch", for: "quiz-fr" },
    h("input", { id: "quiz-fr", type: "checkbox", checked: UI.quizFr, onchange: (e) => { UI.quizFr = e.target.checked; saveUI(); paintQuiz(); } }), "Show in French");
  sec.append(h("div", { class: "quiz-head" },
    h("div", null, h("span", { class: "label", text: `Comprehension · ${plural(n, "question", "questions")}` }), h("h2", { id: "quiz-h", lang: "sv", text: "Frågor" })),
    frSwitch));

}
function paintQuiz() {
  if (!R) return;
  const list = $("#quiz-list");
  if (!list) return;
  const qs = R.t.questions;
  list.replaceChildren();
  qs.forEach((q, qi) => {
    const chosen = R.answers[qi];
    const done = chosen >= 0;
    const box = h("div", { class: "q", role: "group", "aria-labelledby": `q-${qi}` },
      h("span", { class: "q-n", text: `${qi + 1}/${qs.length}` }),
      h("p", { class: "q-sv", id: `q-${qi}`, lang: "sv", text: q.q }),
      UI.quizFr && q.qFr ? h("p", { class: "q-fr", text: q.qFr }) : null);
    const opts = h("div", { class: "opts" });
    q.options.forEach((o, oi) => {
      let cls = "opt";
      if (done && oi === q.answer) cls += " right";
      else if (done && oi === chosen) cls += " wrong";
      const ofr = Array.isArray(q.optionsFr) ? str(q.optionsFr[oi]) : "";
      opts.append(h("button", { class: cls, type: "button", disabled: done, "aria-pressed": done ? String(oi === chosen) : null,
        onclick: () => answer(qi, oi) },
        h("span", { class: "k", text: "ABCDEF"[oi] || "·" }), h("span", { lang: "sv", text: str(o) }),
        UI.quizFr && ofr ? h("span", { class: "ofr", text: ofr }) : null));
    });
    box.append(opts);
    if (done) {
      const right = chosen === q.answer;
      box.append(h("p", { class: "verdict " + (right ? "ok" : "ko"), role: "status" },
        h("b", { text: right ? "Correct answer. " : `Not quite: the correct answer is ${"ABCDEF"[q.answer]}. ` }), str(q.explFr)));
    }
    list.append(box);
  });
  const score = $("#quiz-score");
  score.replaceChildren();
  if (R.answers.every((a) => a >= 0)) {
    const c = R.answers.filter((a, i) => a === qs[i].answer).length;
    score.append(h("div", { class: "score" },
      h("strong", { class: "typed", text: `${c}/${qs.length}` }),
      h("span", { text: c === qs.length ? "All answers are correct." : "Score saved. Reread the cited passages, then try again." }),
      h("button", { class: "btn small", type: "button", text: "Restart the quiz", onclick: () => {
        R.answers = R.answers.map(() => -1); setProgress(R.id, { ans: undefined }); paintQuiz();
        $("#quiz").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
      } })));
  }
}
function answer(qi, oi) {
  if (!R || R.answers[qi] >= 0) return;
  R.answers[qi] = oi;
  const qs = R.t.questions;
  const patch = { ans: R.answers.slice() };
  if (R.answers.every((a) => a >= 0)) {
    patch.quiz = { c: R.answers.filter((a, i) => a === qs[i].answer).length, n: qs.length };
    patch.read = true;
  }
  setProgress(R.id, patch);
  paintQuiz();
  if (patch.quiz) { renderEndMark(); Persist.flushAll(); }
  const btn = document.querySelectorAll("#quiz-list .q")[qi];
  if (btn) { const v = btn.querySelector(".verdict"); if (v) v.focus && v.setAttribute("tabindex", "-1"); }
}

/* =====================================================================
   13. CONJUGAISON — verbes des textes et du jeu : réguliers, puis
   irréguliers, chacun par classe. data/conjugations.json est chargé à
   l'ouverture de l'onglet, une seule fois, puis gardé en mémoire.
   ===================================================================== */
const Conj = { promise: null, verbs: null, q: "", scope: "all", sub: "all" };   // scope: all · regular · irregular ; sub: all ou une classe du groupe (session seulement)
const CONJ_GROUPS = [
  { group: "regular", title: "Regular verbs", intro: "They follow a pattern: the forms can be worked out from the infinitive.",
    classes: [
      { key: "1", title: "1st conjugation", desc: "Present in -ar: prata, arbeta." },
      { key: "2", title: "2nd conjugation", desc: "Present in -er, preterit in -te: köpa, läsa." },
      { key: "3", title: "3rd conjugation", desc: "Present in -r, preterit in -de or -dde: bo, hyra, höra." },
      { key: "4", title: "4th conjugation", desc: "Present in -er, preterit in -de: bygga, ringa." }
    ] },
  { group: "irregular", title: "Irregular verbs", intro: "Their forms cannot be worked out from the infinitive: they have to be memorised.",
    classes: [
      { key: "strong", title: "Verbes forts", desc: "The preterite and supine change the vowel: dricka, sitta, springa." },
      { key: "irregular", title: "Other irregular verbs", desc: "Forms with no common pattern: vara, ha, gå, säga, komma." }
    ] }
];
const CONJ_SCOPES = [["all", "All"], ["regular", "Regular"], ["irregular", "Irregular"]];
const CONJ_SUBS = {
  regular: [["1", "1re conj. (-ar)"], ["2", "2e conj. (-er)"], ["3", "3e conj. (-r)"], ["4", "4e conj. (-er/-de)"], ["all", "All regular"]],
  irregular: [["strong", "Forts"], ["irregular", "Other irregular verbs"], ["all", "All irregular"]]

function conjInScope(v) {
  if (Conj.scope === "all") return true;
  return v.group === Conj.scope && (Conj.sub === "all" || v.cls === Conj.sub);
}
function conjChip(key, label, onpick) {
  return h("button", { class: "chip", type: "button", "data-key": key, onclick: onpick }, label);
}

  if (box) for (const b of box.children) b.setAttribute("aria-pressed", String(b.dataset.key === key));
}
function paintConjSub() {
  const box = $("#conj-sub");
  if (!box) return;
  const subs = CONJ_SUBS[Conj.scope] || [];
  box.setAttribute("aria-label", Conj.scope === "regular" ? "Regular verb conjugation" : "Irregular verb type");
  box.replaceChildren(...subs.map(([key, label]) => conjChip(key, label, () => {
    Conj.sub = key; pressChips(box, key); paintConjugationLists();
  })));

}
function loadConjugations() {
  if (!Conj.promise) {
    Conj.promise = fetch("data/conjugations.json", { cache: "no-cache" })
      .then((r) => { if (!r.ok) throw new Error(`file data/conjugations.json: error ${r.status}`); return r.json(); })
      .then((j) => {
        if (!isObj(j) || !isObj(j.verbs)) throw new Error("fichier data/conjugations.json : format inattendu");
        Conj.verbs = Object.entries(j.verbs)
          .filter(([, v]) => isObj(v) && isObj(v.forms))
          .map(([lemma, v]) => ({ lemma, fr: str(v.fr), group: str(v.group), cls: String(v.class), forms: v.forms, sources: Array.isArray(v.sources) ? v.sources : [] }));
        return Conj.verbs;

}

    h("div", null, h("span", { class: "label", text: "Verbs · forms from the texts and games" }), h("h1", { text: "Conjugation" }),

function paintConjugations(body) {

      h("p", { text: "Supine: the form used with “har” (har sagt). Imperative: the direct command, when it exists. “—”: form not provided." })),
    h("div", { class: "w-tools" },
      h("input", { class: "search", id: "conj-q", type: "search", placeholder: "Search for a verb", value: Conj.q,
        "aria-label": "Search for a verb or form", autocomplete: "off",

      h("span", { class: "typed muted", id: "conj-count", "aria-live": "polite" })),
    h("div", { class: "chips conj-filter", id: "conj-scope", role: "group", "aria-label": "Type de verbe" },
      CONJ_SCOPES.map(([key, label]) => conjChip(key, label, () => {

/* =====================================================================
   12. MES MOTS & LEITNER REVIEW
   ===================================================================== */
/* Tutor : a chat with Claude about Swedish. Needs the artifact's « sample » capability (declared at publish);
   without it the page says so. The history is kept in memory for the session and sent with each question. */
const Prof = { msgs: [], busy: false, sample: undefined };
const PROF_INSTRUCTIONS = "You are a Swedish tutor for an English speaker. Answer in English, clearly and concisely, with Swedish examples followed by their translation. If the question is not about Swedish, politely bring the conversation back to Swedish.";
/** The sample function of the artifact, or null outside an artifact or without the capability. Resolved once. */
async function profSampleFn() {
  if (Prof.sample !== undefined) return Prof.sample;
  try {
    Prof.sample = (window.claude && typeof window.claude.use === "function" && (await window.claude.use("sample"))) || null;
  } catch { Prof.sample = null; }
  return Prof.sample;
}
function renderProf() {
  const root = viewRoot();
  const log = h("div", { class: "chat-log", "aria-live": "polite" });
  const input = h("textarea", { class: "chat-input", rows: "3", placeholder: "Your question about Swedish…", "aria-label": "Your question" });
  const send = h("button", { class: "btn primary", type: "button", text: "Envoyer" });
  const note = h("p", { class: "sit-notice", role: "status", hidden: true });
  const paint = () => {
    log.replaceChildren(...(Prof.msgs.length ? Prof.msgs : [{ role: "assistant", content: "Hello! Ask me your questions about grammar, vocabulary, pronunciation or a sentence from a text." }])
      .map((m) => h("div", { class: "chat-msg " + m.role }, h("b", { text: m.role === "user" ? "You" : "Tutor" }), h("p", { text: m.content || "…" }))));
    log.scrollTop = log.scrollHeight;
    send.disabled = Prof.busy;
  };
  const ask = async () => {
    const q = input.value.trim();
    if (!q || Prof.busy) return;
    Prof.busy = true; note.hidden = true;
    input.value = "";
    const history = Prof.msgs.slice(-12).map((m) => ({ role: m.role, content: m.content }));
    Prof.msgs.push({ role: "user", content: q });
    const reply = { role: "assistant", content: "" };
    Prof.msgs.push(reply);
    paint();
    const sample = await profSampleFn();
    if (!sample) {
      Prof.msgs.splice(-2, 2);
      note.textContent = "The tutor is only available in the published version of the app (access to Claude allowed).";
      note.hidden = false; Prof.busy = false; paint(); input.value = q;
      return;
    }
    const messages = [...history, { role: "user", content: `${PROF_INSTRUCTIONS}\n\nQuestion : ${q}` }];
    try {
      const res = await sample(messages, { cache: false, onText: ({ text }) => { reply.content = text; paint(); } });
      reply.content = (res && res.text) || reply.content || "I could not answer. Try again.";
    } catch (e) {
      const code = e && e.code;
      Prof.msgs.splice(-2, 2);
      note.textContent = code === "not_granted" ? "Access to the tutor was not granted for this page."

/* =====================================================================

   Two columns, always 5 + 5 words visible: Swedish on the left, French

   13d. JEU — « Écouter et choisir » (#jeu, third sub-choice)

/** Resemblance of two Swedish words, from 0 (nothing shared) to 1 (same first three letters, lengths within 1).

/* =====================================================================
   13e. JEU — « Situations » (#jeu, fourth sub-choice)

   sentence green and a wrong one red, then the verdict « Juste » or
   « Faux » is shown with the right sentence, its French translation and

   Data: data/situations.json = { "levels": [ { "level", "items": [...] } ] }.

   unknown theme counts as « autre »). Settings: levels (checkboxes, several

  const blocks = isObj(j) && Array.isArray(j.levels) ? j.levels : [];

function situationsSvLoad() {

/** The request and the body read share one 30 s limit. A failure carries its short cause in situationsCause

async function situationsSvFetch() {
  let controller = null;
  let timer = null;
  let cause = "unknown error";
  try {
    controller = new AbortController();
    timer = setTimeout(() => controller.abort(), SITUATIONS_SV_TIMEOUT_MS);
    const r = await fetch("data/situations-sv.json", { cache: "no-cache", signal: controller.signal });
    if (!r.ok) { cause = `error ${r.status}`; throw new Error(`file data/situations-sv.json: ${cause}`); }
    const j = await r.json();
    if (!isObj(j) || !isObj(j.items)) { cause = "unexpected format"; throw new Error(`file data/situations-sv.json: ${cause}`); }
    return j.items;
  } catch (e) {
    if (controller && controller.signal.aborted) cause = `timeout after ${SITUATIONS_SV_TIMEOUT_MS / 1000} s`;
    else if (e instanceof SyntaxError) cause = "format inattendu";
    else if (e instanceof TypeError) cause = "network error";
    try { console.warn(`data/situations-sv.json: Swedish text not read (${cause})`, e); } catch { /* console indisponible */ }
    const err = new Error(`fichier data/situations-sv.json : ${cause}`);
    err.situationsCause = cause;
    throw err;
