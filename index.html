<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lire et écouter des textes en suédois, du niveau A1 au C2.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1D594B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#7DC6AA" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Läsning">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Svenska Läsaren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Schibsted+Grotesk:wght@400..900&display=swap">
<style>
/* =====================================================================
   DESIGN TOKENS
   Layout: phone-first single column — oversized level sign-plates (the one
   loud element) over a ruled library catalogue; the reader is one ~65ch
   Literata column with hymnal-style sentence numbers, play-script speaker
   labels and a player bar docked to the bottom edge.
   ===================================================================== */
:root{
  /* Core palette — Swedish print & signage */
  --papper:#F1F2EE;      /* birch-white book paper */
  --blaeck:#1A1E26;      /* blue-black ink */
  --grafit:#5A606C;      /* pencil graphite: secondary text */
  --gran:#1D594B;        /* spruce green: the single UI accent */
  --markor:#FFD449;      /* highlighter / road-sign yellow: "here, now" */
  --stampel:#5B3D9C;     /* library date-stamp violet: saved words, due dates */

  /* Derived surfaces (explicit per theme, no color-mix dependency) */
  --surface:#FAFAF7;
  --rule:#D3D6CF;
  --rule-2:#B9BDB5;
  --band:#DCE8E2;        /* current sentence */
  --hover:#E3EAE5;       /* word hover */
  --on-markor:#1A1E26;
  --on-gran:#F5F7F3;
  --scrim:rgba(18,22,28,.28);
  --shadow:0 12px 32px rgba(18,22,28,.16), 0 2px 6px rgba(18,22,28,.08);

  /* Speakers: Stockholm T-bana line colours (röda, blå, gröna linjen) */
  --sp-a:#BF1F2C;
  --sp-b:#1460AD;
  --sp-c:#2A7A3C;
  --sp-n:#5A606C;

  /* Semantic (separate from the accent) */
  --ok:#2A7A3C;
  --bad:#B3261E;

  /* Type roles */
  --f-read:"Literata","Iowan Old Style","Charter","Georgia","Cambria",serif;          /* reading */
  --f-sign:"Schibsted Grotesk","Helvetica Neue","Arial",system-ui,sans-serif;        /* signage / UI */
  --f-type:"Courier Prime","Courier New",Courier,ui-monospace,monospace;              /* catalogue-card typewriter: data */

  --read-size:20px;
  --measure:65ch;
  --bar-h:76px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papper:#121519; --blaeck:#E3E5E0; --grafit:#9AA1AC; --gran:#7DC6AA; --markor:#EFC445; --stampel:#B8A3F3;
    --surface:#1A1E24; --rule:#2D333B; --rule-2:#434B55; --band:#1D322C; --hover:#243530;
    --on-markor:#14161A; --on-gran:#0E1512; --scrim:rgba(0,0,0,.5);
    --shadow:0 14px 36px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
    --sp-a:#FF8D92; --sp-b:#88B9F3; --sp-c:#88D196; --sp-n:#9AA1AC; --ok:#88D196; --bad:#FF8E84;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papper:#121519; --blaeck:#E3E5E0; --grafit:#9AA1AC; --gran:#7DC6AA; --markor:#EFC445; --stampel:#B8A3F3;
  --surface:#1A1E24; --rule:#2D333B; --rule-2:#434B55; --band:#1D322C; --hover:#243530;
  --on-markor:#14161A; --on-gran:#0E1512; --scrim:rgba(0,0,0,.5);
  --shadow:0 14px 36px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --sp-a:#FF8D92; --sp-b:#88B9F3; --sp-c:#88D196; --sp-n:#9AA1AC; --ok:#88D196; --bad:#FF8E84;
  color-scheme:dark;
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--papper);color:var(--blaeck);font:400 15px/1.5 var(--f-sign);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--gran);text-underline-offset:.18em}
:focus-visible{outline:2.5px solid var(--gran);outline-offset:2px;border-radius:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.ic{width:1.25em;height:1.25em;fill:currentColor;flex:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1140px;margin-inline:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 14px;border:1.5px solid var(--blaeck);border-radius:3px;background:transparent;color:var(--blaeck);font:600 14px/1.15 var(--f-sign);text-decoration:none;text-align:left}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--gran);border-color:var(--gran);color:var(--on-gran)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;padding-inline:8px}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-2);border-radius:999px;background:transparent;padding:6px 12px;font:500 13px/1.2 var(--f-sign);color:var(--blaeck)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--blaeck);border-color:var(--blaeck);color:var(--papper)}
.label{font:600 11.5px/1.3 var(--f-sign);letter-spacing:.11em;text-transform:uppercase;color:var(--grafit)}
.typed{font-family:var(--f-type);font-variant-numeric:tabular-nums}
.muted{color:var(--grafit)}
.switch{display:inline-flex;align-items:center;gap:10px;font:500 14px var(--f-sign);cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--rule-2);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--papper);transition:transform .15s}
.switch input:checked{background:var(--gran)}
.switch input:checked::after{transform:translateX(16px)}

/* =====================================================================
   APP HEADER
   ===================================================================== */
.app-head{border-bottom:1.5px solid var(--blaeck);padding-block:12px 0}
.app-head .inner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;text-decoration:none;color:var(--blaeck)}
.brand b{font:850 21px/1 var(--f-sign);letter-spacing:-.02em}
.brand span{font:italic 400 14px var(--f-read);color:var(--grafit)}
.nav{display:flex;gap:2px;margin-bottom:-1.5px}
.nav a{position:relative;display:flex;align-items:center;gap:7px;padding:9px 12px 11px;font:600 14px/1 var(--f-sign);color:var(--grafit);text-decoration:none;border-bottom:3px solid transparent}
.nav a:hover{color:var(--blaeck)}
.nav a[aria-current="page"]{color:var(--blaeck);border-bottom-color:var(--blaeck)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--stampel);color:var(--papper);font:700 11.5px/1 var(--f-type)}
@media (max-width:520px){
  .app-head .inner{flex-direction:column;align-items:stretch}
  .nav{justify-content:space-between}
  .nav a{padding-inline:6px}
}

main{display:block;padding-block:22px 64px}
.view-reader main,.view-reader + .foot{padding-bottom:calc(var(--bar-h) + 48px + env(safe-area-inset-bottom,0px))}

/* =====================================================================
   LIBRARY
   ===================================================================== */
.lib-eyebrow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 28px;padding:0;list-style:none}
@media (min-width:760px){.plates{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}}
.plate{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px 10px 0;border:1.5px solid var(--blaeck);border-radius:3px;background:transparent;color:var(--blaeck);text-align:left;overflow:hidden}
.plate:hover{background:var(--hover)}
.plate .code{font:850 clamp(46px,14.5vw,96px)/.8 var(--f-sign);letter-spacing:-.055em;margin-left:-.04em;padding-top:4px}
.plate .name{font:600 13px/1.2 var(--f-sign)}
.plate .count{font:400 12.5px/1.2 var(--f-type);color:var(--grafit)}
.plate .bar{display:block;height:5px;margin:4px -10px 0;background:var(--rule)}
.plate .bar i{display:block;height:100%;background:var(--blaeck)}
.plate[aria-selected="true"]{background:var(--markor);border-color:var(--markor);color:var(--on-markor)}
.plate[aria-selected="true"] .count{color:var(--on-markor)}
.plate[aria-selected="true"] .bar{background:rgba(0,0,0,.14)}
.plate[aria-selected="true"] .bar i{background:var(--on-markor)}
.plate.empty .code{opacity:.35}

.lib-grid{display:grid;gap:28px}
@media (min-width:960px){.lib-grid{grid-template-columns:minmax(0,1fr) 300px;gap:48px}.lib-aside{order:2}.lib-main{order:1}}
.lib-main{min-width:0}
.lib-aside{display:grid;gap:18px;align-content:start}
.lvl-head h1{font:800 26px/1.15 var(--f-sign);letter-spacing:-.01em}
.lvl-head p{font:400 16px/1.5 var(--f-read);color:var(--grafit);margin-top:6px}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px}
.meter .track{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--gran)}
.continue{display:grid;gap:4px;padding:14px;border:1.5px solid var(--blaeck);border-radius:3px;text-decoration:none;color:var(--blaeck)}
.continue:hover{background:var(--hover)}
.continue b{font:600 19px/1.25 var(--f-read)}

.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:6px}
.catalog{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:3px 12px;padding:15px 6px 15px 0;border-top:1px solid var(--rule);color:var(--blaeck);text-decoration:none}
.row:hover{background:var(--hover)}
.row .num{grid-row:1 / span 3;font:400 15px/1.6 var(--f-type);color:var(--grafit);padding-left:4px}
.row .sv{font:600 21px/1.25 var(--f-read);letter-spacing:-.005em}
.row .fr{grid-column:2;font:italic 400 15.5px/1.4 var(--f-read);color:var(--grafit)}
.row .meta{grid-column:2 / span 2;font:500 12px/1.5 var(--f-sign);letter-spacing:.04em;color:var(--grafit)}
.row .meta b{font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.status{grid-column:3;grid-row:1;justify-self:end;align-self:start;margin-top:3px;font:700 11.5px/1.2 var(--f-type);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--grafit)}
.status.wip{color:var(--gran)}
.status.read{color:var(--stampel);border:1.5px solid currentColor;border-radius:3px;padding:3px 6px 2px;transform:rotate(-3deg)}
.empty-note{padding:28px 0;font:400 16px/1.6 var(--f-read);color:var(--grafit)}

.foot{padding-block:20px 28px;border-top:1px solid var(--rule);font:400 13px/1.5 var(--f-sign);color:var(--grafit)}

/* Skeleton & states */
.skel{display:block;background:var(--rule);border-radius:3px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.state{max-width:34rem;padding:28px 0;display:grid;gap:12px;justify-items:start}
.state h2{font:800 24px/1.2 var(--f-sign)}
.state p{font:400 16.5px/1.6 var(--f-read)}
.state code{font:400 14px var(--f-type);background:var(--surface);border:1px solid var(--rule);padding:1px 5px;border-radius:2px}

/* =====================================================================
   READER
   ===================================================================== */
.reader{max-width:var(--measure-px,46rem)}
.back{display:inline-flex;align-items:center;gap:4px;font:600 14px var(--f-sign);color:var(--grafit);text-decoration:none;margin:-4px 0 18px -6px;padding:4px 6px}
.back:hover{color:var(--blaeck)}
.r-eyebrow{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:12px}
.r-title{font:700 clamp(31px,7.4vw,46px)/1.1 var(--f-read);font-optical-sizing:auto;letter-spacing:-.015em}
.r-title .w{border-radius:3px}
.r-titlefr{font:italic 400 19px/1.4 var(--f-read);color:var(--grafit);margin-top:8px}
.r-meta{margin-top:14px;font:400 13px/1.5 var(--f-type);color:var(--grafit)}
.r-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:18px 0 6px;padding:10px 0;border-block:1px solid var(--rule)}
.sizer{display:inline-flex;border:1.5px solid var(--blaeck);border-radius:3px;overflow:hidden}
.sizer button{min-width:44px;min-height:36px;border:0;background:transparent;font:700 14px var(--f-sign)}
.sizer button + button{border-left:1.5px solid var(--blaeck)}
.sizer button:hover{background:var(--hover)}
.sizer button:disabled{opacity:.35;cursor:not-allowed}
.r-summary{margin-top:12px;font:400 16.5px/1.6 var(--f-read);max-width:62ch}
.r-grammar{margin-top:14px;display:grid;gap:3px;max-width:62ch}
.r-grammar p{font:400 15.5px/1.55 var(--f-read)}
.cast{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font:500 13.5px/1.4 var(--f-sign)}
.cast a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.cast a:hover span:last-child{text-decoration:underline}
.cast i{width:14px;height:5px;border-radius:3px;background:var(--sp)}
.cast .who{color:var(--sp);font-weight:700}
.notice{display:grid;gap:6px;margin:16px 0 0;padding:12px 14px;border:1.5px dashed var(--rule-2);border-radius:3px;font:400 14.5px/1.5 var(--f-sign)}

.text{margin-top:26px;font:400 var(--read-size)/1.78 var(--f-read);max-width:var(--measure);overflow-wrap:break-word}
.para{margin:0 0 1.05em}
.turn{display:grid;gap:2px;margin:0 0 .9em}
.turn .who{font:700 .62em/1.4 var(--f-sign);letter-spacing:.12em;text-transform:uppercase;color:var(--sp);display:flex;align-items:center;gap:.5em;padding-top:.15em}
.turn .who::before{content:"";width:1.1em;height:.32em;border-radius:.2em;background:var(--sp)}
.turn .para{margin:0}
.turn.narr .para{font-style:italic;color:var(--grafit)}
@media (min-width:760px){
  .turn{grid-template-columns:7.2rem minmax(0,1fr);gap:0 18px}
  .turn .who{justify-content:flex-end;text-align:right;padding-top:.62em}
  .turn .who::before{order:2}
  .turn.narr .para{grid-column:2}
  .dlg-text{max-width:calc(var(--measure) + 8.4rem)}
}
.s{border-radius:3px;transition:background-color .18s}
.s.is-current{background:var(--band);box-shadow:0 0 0 3px var(--band);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sn{position:relative;top:-.62em;display:inline-block;border:0;background:none;padding:0 .28em 0 .12em;margin:0;font:600 .56em/1 var(--f-sign);vertical-align:baseline;color:var(--grafit);font-variant-numeric:tabular-nums}
.sn::after{content:"";position:absolute;inset:-14px -6px}
.sn:hover{color:var(--gran);text-decoration:underline}
.s.is-current .sn{color:var(--gran)}
.w{cursor:pointer;border-radius:2px;transition:background-color .12s}
.w:hover{background:var(--hover);box-shadow:0 0 0 2px var(--hover)}
.w.is-saved{text-decoration:underline dotted var(--stampel);text-decoration-thickness:2px;text-underline-offset:.24em}
.w.is-speaking{transition:none;background:var(--markor);color:var(--on-markor);box-shadow:0 0 0 2px var(--markor)}
.w.is-open{outline:2px solid var(--gran);outline-offset:1px}
.tr{display:none;font:italic 400 .84em/1.5 var(--f-read);color:var(--grafit);margin:.15em 0 .65em}
.tr .ex{display:none;font-style:normal;font-family:var(--f-sign);font-size:.84em;margin-top:.35em}
.tr .ex b{font-weight:700;color:var(--blaeck)}
.tr.is-open{display:block;padding-left:.8em;border-left:2px solid var(--gran)}
.tr.is-open .ex{display:block}
.text.show-tr .s{display:block}
.text.show-tr .tr{display:block}
.text.show-tr .para{margin-bottom:1.3em}
.end-mark{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:30px 0 8px;padding-top:16px;border-top:1.5px solid var(--blaeck)}
.end-mark .slut{font:800 13px/1 var(--f-sign);letter-spacing:.3em;text-transform:uppercase}

/* Quiz */
.quiz{margin-top:44px;max-width:var(--measure);font-size:var(--read-size)}
.quiz-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:8px}
.quiz-head h2{font:800 28px/1.1 var(--f-sign);letter-spacing:-.01em}
.q{padding:20px 0;border-top:1px solid var(--rule)}
.q-n{font:400 13px var(--f-type);color:var(--grafit)}
.q-sv{font:600 1em/1.45 var(--f-read);margin-top:4px}
.q-fr{font:italic 400 .82em/1.45 var(--f-read);color:var(--grafit);margin-top:2px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:1.6em minmax(0,1fr);gap:2px 8px;width:100%;padding:11px 12px;border:1.5px solid var(--rule-2);border-radius:3px;background:var(--surface);text-align:left;font:400 .88em/1.4 var(--f-read);color:var(--blaeck)}
.opt:hover:not(:disabled){border-color:var(--blaeck)}
.opt .k{font:700 .9em/1.5 var(--f-type);color:var(--grafit)}
.opt .ofr{grid-column:2;font-style:italic;color:var(--grafit);font-size:.92em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.verdict{margin-top:12px;font:400 .85em/1.55 var(--f-read)}
.verdict b{font-family:var(--f-sign);font-size:.92em;letter-spacing:.02em}
.verdict.ok b{color:var(--ok)} .verdict.ko b{color:var(--bad)}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 0;border-top:1.5px solid var(--blaeck)}
.score strong{font:800 30px/1 var(--f-sign)}
.next-link{display:grid;gap:4px;margin-top:28px;padding:16px;border:1.5px solid var(--blaeck);border-radius:3px;text-decoration:none;color:var(--blaeck);max-width:var(--measure)}
.next-link:hover{background:var(--hover)}
.next-link b{font:600 21px/1.25 var(--f-read)}

/* =====================================================================
   PLAYER BAR (fixed bottom, safe-area aware)
   ===================================================================== */
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--papper);border-top:1.5px solid var(--blaeck);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player-prog{position:absolute;left:0;right:0;top:-1.5px;height:4px;pointer-events:none}
.player-prog i{display:block;height:100%;width:0;background:var(--gran);transition:width .3s}
.player-in{max-width:1140px;margin:0 auto;display:flex;align-items:center;gap:8px}
.pbtn{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--blaeck);flex:none}
.pbtn:hover:not(:disabled){background:var(--hover)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn.play{width:54px;height:54px;background:var(--blaeck);color:var(--papper)}
.pbtn.play:hover:not(:disabled){background:var(--gran);color:var(--on-gran)}
.pbtn.play .ic{width:26px;height:26px}
.player-status{flex:1;min-width:0;display:grid;gap:1px;padding-left:6px}
.ps-main{font:700 14px/1.25 var(--f-sign);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-sub{font:400 12.5px/1.3 var(--f-type);color:var(--grafit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =====================================================================
   2. STATE & SETTINGS
   S = synced state (settings, progress, saved words). UI = per-browser
   conveniences (selected level, filters) kept in localStorage only.

const DEFAULT_SETTINGS = { voices: { N: "", A: "", B: "", C: "" }, rates: {}, fontSize: 20, showTr: false };
const S = { settings: structuredCloneSafe(DEFAULT_SETTINGS), settingsT: 0, progress: {}, words: {} };
const UI = { level: "A1", type: "all", wSort: "recent", wLevel: "all", wQuery: "", quizFr: false, levelChosen: false, gLevel: "", gSource: "all", gCount: 10 };

function structuredCloneSafe(o) { return JSON.parse(JSON.stringify(o)); }

function normSettings(raw) {
  const s = structuredCloneSafe(DEFAULT_SETTINGS);
  if (!isObj(raw)) return s;
  if (isObj(raw.voices)) for (const k of ["N", "A", "B", "C"]) s.voices[k] = str(raw.voices[k]);
  if (isObj(raw.rates)) for (const lv of LEVELS) {
    const r = Number(raw.rates[lv]);
    if (r >= 0.5 && r <= 1.5) s.rates[lv] = r;
  }
  const f = Number(raw.fontSize);
  if (f >= FONT_MIN && f <= FONT_MAX) s.fontSize = Math.round(f);

}
function normProgress(p) {
  if (!isObj(p)) return null;
  const out = { t: Number(p.t) || 0 };
  if (p.read === true) out.read = true;
  if (isObj(p.quiz) && Number.isFinite(p.quiz.c) && Number.isFinite(p.quiz.n)) out.quiz = { c: p.quiz.c, n: p.quiz.n };
  if (Array.isArray(p.ans)) out.ans = p.ans.map((a) => (Number.isInteger(a) ? a : -1));
  if (Number.isInteger(p.pos) && p.pos >= 0) out.pos = p.pos;
  if (Number(p.seen) > 0) out.seen = Number(p.seen);
  return out;
}
function normWord(w) {
  if (!isObj(w)) return null;
  if (w.del) return { del: true, t: Number(w.t) || 0 };
  const box = Number.isInteger(w.box) ? clamp(w.box, 1, 5) : 1;
  return {
    lemma: str(w.lemma), form: str(w.form), fr: str(w.fr), pos: str(w.pos), g: str(w.g),
    ex: { sv: str(w.ex && w.ex.sv), fr: str(w.ex && w.ex.fr) },
    textId: str(w.textId), level: LEVELS.includes(w.level) ? w.level : "",
    box, due: /^\d{4}-\d{2}-\d{2}$/.test(w.due) ? w.due : today(),

}
function normMap(items, fn) {
  const out = {};
  if (isObj(items)) for (const [k, v] of Object.entries(items)) { const n = fn(v); if (n) out[k] = n; }
  return out;
}

/* Mutators — every change goes through these so it is persisted. */
function changeSettings(mut) {

}
function setProgress(id, patch) {

  for (const k of Object.keys(next)) if (next[k] === undefined) delete next[k];
  const a = JSON.stringify({ ...cur, t: 0 }), b = JSON.stringify({ ...next, t: 0 });

const liveWords = () => Object.entries(S.words).filter(([, w]) => w && !w.del);
const isSaved = (key) => !!(S.words[key] && !S.words[key].del);
const dueCount = () => { const d = today(); return liveWords().filter(([, w]) => w.due <= d).length; };
function rateFor(level) { return S.settings.rates[level] || RATE_DEFAULT[level] || 1; }

/* =====================================================================
   3. PERSISTENCE
   Local = localStorage cache (try/catch, may be absent → memory only).
   Remote = `db` capability, private per viewer under data/users/<uid>/:
     settings · progress · words-0 … words-7 (words sharded so each doc
     stays far below the 256 KiB limit). Each record carries `t` (ms) and
     merges last-writer-wins; deleted words are kept as {del:true,t}
     tombstones so a removal on one device is not resurrected by another.
   Writes: only on change, debounced, one in flight per document.
   ===================================================================== */
const LS = "svl1:";
const Local = {
  ok: (() => { try { const k = LS + "probe"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch { return false; } })(),
  read(name) {
    if (!this.ok) return null;
    try { const s = localStorage.getItem(LS + name); return s ? JSON.parse(s) : null; } catch { return null; }
  },
  write(name, obj) {
    if (!this.ok) return;
    try { localStorage.setItem(LS + name, JSON.stringify(obj)); } catch { /* quota or blocked: memory only */ }
  }
};

const SHARDS = 8;
function shardOf(key) {
  let x = 2166136261;
  for (let i = 0; i < key.length; i++) { x ^= key.charCodeAt(i); x = Math.imul(x, 16777619); }
  return "words-" + ((x >>> 0) % SHARDS);
}

const Persist = {

  dirty: new Set(),
  changed(kind, key) {

  },
  saveLocal() {
    clearTimeout(this.timer);
    if (this.dirty.has("settings")) Local.write("settings", { t: S.settingsT, data: S.settings });
    if (this.dirty.has("progress")) Local.write("progress", { items: S.progress });
    if (this.dirty.has("words")) Local.write("words", { items: S.words });
    this.dirty.clear();
  },
  loadLocal() {
    const ls = Local.read("settings");
    if (ls && ls.data) { S.settings = normSettings(ls.data); S.settingsT = Number(ls.t) || 0; }
    const lp = Local.read("progress");
    if (lp) S.progress = normMap(lp.items, normProgress);
    const lw = Local.read("words");
    if (lw) S.words = normMap(lw.items, normWord);
    const lu = Local.read("ui");
    if (isObj(lu)) {
      if (LEVELS.includes(lu.level)) { UI.level = lu.level; UI.levelChosen = !!lu.levelChosen; }
      if (lu.type === "all" || TYPES[lu.type]) UI.type = lu.type;
      if (lu.wSort === "recent" || lu.wSort === "alpha") UI.wSort = lu.wSort;
      if (lu.wLevel === "all" || LEVELS.includes(lu.wLevel)) UI.wLevel = lu.wLevel;
      UI.quizFr = lu.quizFr === true;
      if (LEVELS.includes(lu.gLevel)) UI.gLevel = lu.gLevel;
      if (lu.gSource === "all" || ID_RE.test(str(lu.gSource))) UI.gSource = lu.gSource;

const Remote = {

  col: null,
  timers: new Map(), inflight: new Set(), again: new Set(), last: new Map(), retries: new Map(),

  body(name) {
    if (name === "settings") return { v: 1, t: S.settingsT, data: S.settings };
    if (name === "progress") return { v: 1, items: S.progress };
    const items = {};
    for (const [k, w] of Object.entries(S.words)) if (shardOf(k) === name) items[k] = w;
    return { v: 1, items };
  },
  schedule(name, delay = 1500) {

  },
  flushAll() { for (const name of [...this.timers.keys()]) { clearTimeout(this.timers.get(name)); this.flush(name); } },
  async flush(name) {

    if (this.inflight.has(name)) { this.again.add(name); return; }

    const json = JSON.stringify(body);
    if (this.last.get(name) === json) return;           // unchanged: no write
    this.inflight.add(name);
    try {
      await this.col.doc(name).set(body);
      this.last.set(name, json);
      this.retries.delete(name);

      } else {

      this.inflight.delete(name);
      if (this.again.delete(name)) this.schedule(name, 300);

  /** Resolve db + user without ever blocking first paint; merge remote into local. */
  async connect() {

    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use("db"), c.use("user")]); } catch { /* treat as absent */ }
    let uid = null;
    if (user) { try { uid = await user.id(); } catch { uid = null; } }
    if (!db || !uid) { this.status = "off"; renderSyncNote(); return; }

/** Last-writer-wins merge per record; returns docs the store is behind on. */
function mergeRemote(remote) {
  const toWrite = new Set();
  let localChanged = false;
  const rs = remote.settings;
  const rt = (rs && Number(rs.t)) || 0;
  if (rs && rs.data && rt > S.settingsT) { S.settings = normSettings(rs.data); S.settingsT = rt; localChanged = true; }
  else if (S.settingsT > rt) toWrite.add("settings");

  const mergeMap = (local, rem, fn, onBehind) => {
    const out = {};
    for (const k of new Set([...Object.keys(local), ...Object.keys(rem)])) {
      const a = local[k], b = rem[k] ? fn(rem[k]) : null;
      if (!b) { out[k] = a; onBehind(k); }
      else if (!a || b.t > a.t) { out[k] = b; localChanged = true; }
      else { out[k] = a; if (a.t > b.t) onBehind(k); }
    }
    return out;
  };
  S.progress = mergeMap(S.progress, (remote.progress && isObj(remote.progress.items)) ? remote.progress.items : {}, normProgress, () => toWrite.add("progress"));
  const rw = {};
  for (const [id, body] of Object.entries(remote)) if (id.startsWith("words-") && body && isObj(body.items)) Object.assign(rw, body.items);
  S.words = mergeMap(S.words, rw, normWord, (k) => toWrite.add(shardOf(k)));
  return { toWrite, localChanged };
}

/* =====================================================================
   4. DATA LOADING (catalog + level files, cached in memory)
   ===================================================================== */
const Data = { catalog: null, list: [], byId: new Map(), error: null, promise: null, levels: new Map() };

function loadCatalog() {
  Data.error = null;
  Data.promise = fetch("data/catalog.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(`fichier data/catalog.json : erreur ${r.status}`); return r.json(); })
    .then((j) => {
      const texts = Array.isArray(j && j.texts) ? j.texts : [];
      const list = [];
      for (const t of texts) {
        if (!isObj(t) || !ID_RE.test(str(t.id))) continue;
        const level = t.id.slice(0, 2).toUpperCase();
        list.push({
          id: t.id, level, type: TYPES[t.type] ? t.type : "vardag",
          title: str(t.title) || t.id.toUpperCase(), titleFr: str(t.titleFr), summaryFr: str(t.summaryFr),
          topicFr: str(t.topicFr), grammarFr: str(t.grammarFr),
          words: Number(t.words) || 0, sentences: Number(t.sentences) || 0, speakers: Number(t.speakers) || 1
        });
      }
      list.sort((a, b) => a.id.localeCompare(b.id));
      Data.catalog = j; Data.list = list;
      Data.byId = new Map(list.map((t) => [t.id, t]));
      return list;
    })
    .catch((e) => { Data.error = e; throw e; });
  return Data.promise;
}
function levelName(lv) {
  const l = Data.catalog && isObj(Data.catalog.levels) && Data.catalog.levels[lv];
  return (l && str(l.fr)) || LEVEL_FR[lv];
}
/** Fetch a level file once; failed loads are forgotten so "Réessayer" works. */
function loadLevel(level) {
  if (!Data.levels.has(level)) {
    const p = fetch(`data/${level.toLowerCase()}.json`, { cache: "no-cache" })
      .then((r) => { if (!r.ok) throw new Error(`fichier data/${level.toLowerCase()}.json : erreur ${r.status}`); return r.json(); })
      .then((j) => new Map((Array.isArray(j && j.texts) ? j.texts : []).filter((t) => isObj(t) && t.id).map((t) => [t.id, t])));
    p.catch(() => Data.levels.delete(level));
    Data.levels.set(level, p);
  }
  return Data.levels.get(level);
}
/** Defensive normalisation: tolerate missing or partial fields. */
function normText(raw, cat) {
  const t = isObj(raw) ? raw : {};
  const id = cat.id;
  const type = TYPES[t.type] ? t.type : cat.type;
  let speakers = {};
  if (isObj(t.speakers)) for (const [k, v] of Object.entries(t.speakers)) {
    speakers[k] = { name: str(v && v.name) || (k === "N" ? "Berättare" : k), gender: (v && (v.gender === "m" || v.gender === "f")) ? v.gender : "f" };
  }
  if (!Object.keys(speakers).length) speakers = { N: { name: "Berättare", gender: "f" } };
  const firstSp = Object.keys(speakers)[0];
  const paragraphs = (Array.isArray(t.paragraphs) ? t.paragraphs : []).map((p) => ({
    sp: isObj(p) && speakers[p.sp] ? p.sp : firstSp,
    sentences: (isObj(p) && Array.isArray(p.sentences) ? p.sentences : [])
      .filter((s) => isObj(s) && typeof s.sv === "string" && s.sv.trim())
      .map((s) => ({ sv: s.sv, fr: str(s.fr), expr: (Array.isArray(s.expr) ? s.expr : []).filter((e) => isObj(e) && str(e.sv)) }))
  })).filter((p) => p.sentences.length);
  const questions = (Array.isArray(t.questions) ? t.questions : []).filter((q) =>
    isObj(q) && str(q.q) && Array.isArray(q.options) && q.options.length >= 2 &&
    Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length);
  return {
    id, level: cat.level, type,
    title: str(t.title) || cat.title, titleFr: str(t.titleFr) || cat.titleFr,
    summaryFr: str(t.summaryFr) || cat.summaryFr, topicFr: str(t.topicFr) || cat.topicFr,
    grammarFr: str(t.grammarFr) || cat.grammarFr,
    speakers, paragraphs, glossary: isObj(t.glossary) ? t.glossary : {}, questions
  };
}
const audioMinutes = (words, level) => Math.max(1, Math.round(words / (WPM * rateFor(level))));
const textWords = (t) => t.paragraphs.reduce((n, p) => n + p.sentences.reduce((m, s) => m + tokenize(s.sv).length, 0), 0);

/* =====================================================================
   5. VOICES (Web Speech API) & CASTING
   ===================================================================== */
const synth = (() => { try { return window.speechSynthesis || null; } catch { return null; } })();
const Utter = window.SpeechSynthesisUtterance || null;
const Voices = { list: [], searching: !!synth, sig: "" };
const isChrome = /Chrome\//.test(navigator.userAgent) && !/Edg\//.test(navigator.userAgent);

function refreshVoices() {
  if (!synth) return;
  let all = [];
  try { all = synth.getVoices() || []; } catch { all = []; }
  const seen = new Set();
  const sv = all.filter((v) => {
    const ok = v && /^sv([-_]|$)/i.test(str(v.lang)) && !seen.has(v.voiceURI || v.name);
    if (ok) seen.add(v.voiceURI || v.name);
    return ok;
  }).sort((a, b) => (b.localService - a.localService) || a.name.localeCompare(b.name, "sv"));
  const sig = sv.map((v) => v.voiceURI + v.name).join("|");
  if (sv.length) Voices.searching = false;
  if (sig === Voices.sig) return;
  Voices.sig = sig;
  Voices.list = sv;
  onVoicesChanged();
}
function initVoices() {
  if (!synth) { Voices.searching = false; return; }
  try {
    if (synth.addEventListener) synth.addEventListener("voiceschanged", refreshVoices);
    else synth.onvoiceschanged = refreshVoices;
  } catch { /* ignore */ }
  refreshVoices();
  // Safari / some Chrome builds never fire voiceschanged: poll a few times.
  [250, 600, 1200, 2500, 4500].forEach((ms, i, arr) => setTimeout(() => {
    refreshVoices();
    if (i === arr.length - 1 && Voices.searching) { Voices.searching = false; onVoicesChanged(); }
  }, ms));
}
function rescanVoices() {
  Voices.searching = !!synth; Voices.sig = "-";
  onVoicesChanged();
  initVoices();
}
function onVoicesChanged() {
  if (R) { R.cast = computeCast(R.t.speakers); renderCast(); renderVoiceNotice(); renderPlayer(); }
  if (App.view === "lecteurs") renderVoices();
  if (App.view === "jeu" && Game.status === "play") paintGameVoice();
}
const voiceKey = (v) => (v ? v.voiceURI || v.name : "");
const voiceByKey = (k) => (k ? Voices.list.find((v) => voiceKey(v) === k) || null : null);
function voiceGender(v) {
  const n = str(v && v.name).toLowerCase();
  if (FEMALE_HINTS.some((x) => n.includes(x))) return "f";
  if (MALE_HINTS.some((x) => n.includes(x))) return "m";

}

  catch (e) { if (stillHere()) viewRoot().append(errorState("La bibliothèque n'a pas pu être chargée.", e, () => { App.view = ""; loadCatalog().catch(() => {}); route(); })); return; }

/** Glossary entry and saved-word key for a token. */

function buildReader(t, cat) {
  const prog = S.progress[t.id] || {};
  R = { id: t.id, t, cat, sentences: [], titleTokens: [], cast: computeCast(t.speakers), answers: [], speakingEl: null, currentEl: null, openEl: null, focusEl: null };
  const isDialog = t.type === "dialog";
  const root = viewRoot();
  const art = h("article", { class: "reader", lang: "fr" });

  // ---- Header
  art.append(h("a", { class: "back", href: "#", onclick: () => { UI.level = t.level; UI.levelChosen = true; saveUI(); } }, icon("back"), `Bibliothèque ${t.level}`));
  art.append(h("div", { class: "r-eyebrow" },

    h("span", { class: "label", text: TYPES[t.type].one }),

  const h1 = h("h1", { class: "r-title", lang: "sv" });

  art.append(h1);

  const words = textWords(t);
  art.append(h("p", { class: "r-meta", text: `${words} mots · ${plural(t.paragraphs.reduce((n, p) => n + p.sentences.length, 0), "phrase", "phrases")} · ≈ ${audioMinutes(words, t.level)} min d'écoute` }));
  if (isDialog) art.append(h("div", { class: "cast", id: "cast" }));

  // ---- Tools row: summary, size, translations
  const sumId = "sum-" + t.id;
  const tools = h("div", { class: "r-tools" });
  if (t.summaryFr) tools.append(h("button", { class: "btn small", type: "button", "aria-expanded": "false", "aria-controls": sumId,
    onclick: (e) => { const s = $("#" + sumId); s.hidden = !s.hidden; e.currentTarget.setAttribute("aria-expanded", String(!s.hidden)); e.currentTarget.textContent = s.hidden ? "Voir le résumé" : "Masquer le résumé"; }, text: "Voir le résumé" }));
  tools.append(h("div", { class: "sizer", role: "group", "aria-label": "Taille du texte" },
    h("button", { type: "button", "data-size": "-1", "aria-label": "Réduire le texte", text: "A−" }),
    h("button", { type: "button", "data-size": "1", "aria-label": "Agrandir le texte", text: "A+" })));
  tools.append(h("label", { class: "switch", for: "tr-top" }, h("input", { id: "tr-top", type: "checkbox", "data-tr-toggle": "" }), "Afficher les traductions"));
  art.append(tools);
  if (t.summaryFr) art.append(h("p", { class: "r-summary", id: sumId, hidden: true, text: t.summaryFr }));
  if (t.grammarFr) art.append(h("div", { class: "r-grammar" }, h("span", { class: "label", text: "Grammaire du texte" }), h("p", { text: t.grammarFr })));
  art.append(h("div", { id: "voice-notice" }));

  // ---- Text: sentences & tokens (spans built once)
  const text = h("div", { class: "text" + (isDialog ? " dlg-text" : "") + (S.settings.showTr ? " show-tr" : ""), lang: "sv" });
  t.paragraphs.forEach((p, pi) => {
    const para = h("p", { class: "para" });
    for (const s of p.sentences) {
      const idx = R.sentences.length;
      const sEl = h("span", { class: "s", "data-s": idx });
      sEl.append(h("button", { class: "sn", type: "button", "data-s": idx, "aria-label": `Lire à partir de la phrase ${idx + 1}`, text: String(idx + 1) }));
      const tokens = [];
      appendTokens(sEl, s.sv, idx, tokens);
      const trEl = h("span", { class: "tr", lang: "fr" }, h("span", { text: s.fr || "(traduction manquante)" }));
      if (s.expr.length) trEl.append(h("span", { class: "ex" }, s.expr.map((e, i) => [i ? h("br") : null, h("b", { lang: "sv", text: e.sv }), " : " + str(e.fr)])));
      para.append(sEl, " ", trEl);
      R.sentences.push({ sv: s.sv, fr: s.fr, expr: s.expr, sp: p.sp, pi, el: sEl, trEl, tokens });
    }
    if (isDialog) {
      const sp = t.speakers[p.sp];
      const turn = h("div", { class: "turn" + (p.sp === "N" ? " narr" : ""), style: `--sp:${SPEAKER_COLOR[p.sp] || "var(--sp-n)"}` });
      if (p.sp !== "N") turn.append(h("span", { class: "who", text: sp.name }));
      turn.append(para);
      text.append(turn);
    } else text.append(para);
  });
  if (!R.sentences.length) text.append(h("p", { class: "empty-note", lang: "fr", text: "Ce texte ne contient pas encore de phrases." }));
  art.append(text);
  const first = text.querySelector(".w");
  if (first) { first.tabIndex = 0; R.focusEl = first; }
  text.addEventListener("click", onTextClick);
  h1.addEventListener("click", onTextClick);
  text.addEventListener("focusin", (e) => { if (e.target.classList.contains("w")) setRoving(e.target); });

  // ---- End of text, quiz, next
  art.append(h("div", { class: "end-mark", id: "end-mark" }));
  if (t.questions.length) art.append(buildQuiz(t, prog));
  else art.append(h("p", { class: "empty-note", text: "Pas de questions de compréhension pour ce texte." }));
  const idx = Data.list.findIndex((x) => x.id === t.id);
  const nxt = Data.list[idx + 1];
  if (nxt) art.append(h("a", { class: "next-link", href: "#" + nxt.id },
    h("span", { class: "label", text: `Texte suivant · ${nxt.id.toUpperCase()} · ${TYPES[nxt.type].one}` }),
    h("b", { lang: "sv", text: nxt.title }), nxt.titleFr ? h("span", { class: "muted", text: nxt.titleFr }) : null));

  root.append(art);
  applySettings();
  refreshSavedMarks();
  renderCast();
  renderVoiceNotice();
  renderEndMark();

  // Resume where the reader left off
  Player.state = "idle"; Player.w = 0;
  Player.s = clamp(prog.pos || 0, 0, Math.max(0, R.sentences.length - 1));
  if (Player.s > 0) markSentence(Player.s);
  $("#player").hidden = false;
  renderPlayer();
  setProgress(t.id, { seen: Date.now() });
}

/** Append text as plain text nodes + clickable word spans. */
function appendTokens(parent, text, sIdx, out) {
  let pos = 0;
  for (const tk of tokenize(text)) {
    if (tk.start > pos) parent.append(text.slice(pos, tk.start));
    const el = h("span", { class: "w", role: "button", tabindex: "-1", "data-s": sIdx, "data-t": out.length, text: tk.text });
    tk.el = el;
    out.push(tk);
    parent.append(el);
    pos = tk.end;
  }
  if (pos < text.length) parent.append(text.slice(pos));
}
function tokenOf(el) {
  const s = Number(el.dataset.s), ti = Number(el.dataset.t);
  const tokens = s < 0 ? R.titleTokens : R.sentences[s] && R.sentences[s].tokens;
  return tokens ? { s, ti, tk: tokens[ti] } : null;
}
function onTextClick(e) {
  const sn = e.target.closest(".sn");
  if (sn) { closePop(); Player.start(Number(sn.dataset.s), 0); return; }
  const w = e.target.closest(".w");
  if (w) { e.stopPropagation(); openWord(w); }
}
function setRoving(el) {
  if (R.focusEl && R.focusEl !== el) R.focusEl.tabIndex = -1;
  el.tabIndex = 0;
  R.focusEl = el;
}
function markSentence(s) {
  if (!R) return;
  if (R.currentEl) R.currentEl.classList.remove("is-current");
  R.currentEl = s >= 0 && R.sentences[s] ? R.sentences[s].el : null;
  if (R.currentEl) R.currentEl.classList.add("is-current");
}
function markWord(ti) {
  if (!R) return;
  if (R.speakingEl) R.speakingEl.classList.remove("is-speaking");
  const sent = R.sentences[Player.s];
  R.speakingEl = ti >= 0 && sent && sent.tokens[ti] ? sent.tokens[ti].el : null;
  if (R.speakingEl) R.speakingEl.classList.add("is-speaking");
}
function scrollToSentence(s) {
  const sent = R && R.sentences[s];

  const r = sent.el.getBoundingClientRect();
  const bottom = window.innerHeight - ($("#player").offsetHeight || 80) - 24;
  if (r.top < 16 || r.bottom > bottom) {

  }
}
function refreshSavedMarks() {

  for (const tk of all) tk.el.classList.toggle("is-saved", isSaved(wordKeyFor(tk.key)));
}

/* =====================================================================

function openWord(el) {
  const info = tokenOf(el);
  if (!info || !info.tk) return;
  if (Player.state === "playing") Player.pause();   // clicking a word pauses the reading
  setRoving(el);
  if (R.openEl) R.openEl.classList.remove("is-open");
  R.openEl = el;
  el.classList.add("is-open");
  const { s, ti, tk } = info;
  const g = gloss(tk.key);
  const sent = s >= 0 ? R.sentences[s] : null;
  const wkey = wordKeyFor(tk.key);
  const pop = $("#pop");
  const lemma = (g && str(g.l)) || tk.text;
  const exprs = sent ? sent.expr.filter((e) => tokenize(e.sv).some((x) => x.key === tk.key)) : [];

  const saveBtn = h("button", { class: "btn" + (isSaved(wkey) ? " saved" : ""), type: "button" });
  const paintSave = () => {
    const on = isSaved(wkey);
    saveBtn.classList.toggle("saved", on);
    saveBtn.replaceChildren(icon(on ? "check" : "plus"), on ? "Retirer de mes mots" : "Ajouter à mes mots");
  };
  saveBtn.addEventListener("click", () => { toggleSave(wkey, tk, g, sent); paintSave(); });
  paintSave();

  const actions = h("div", { class: "pop-actions" },
    h("button", { class: "btn", type: "button", onclick: () => speakOnce(tk.text, R.cast[sent ? sent.sp : "N"] || Object.values(R.cast)[0], Math.min(1, rateFor(R.t.level))) }, icon("speaker"), "Écouter le mot"),
    saveBtn);
  if (sent) {
    const trBtn = h("button", { class: "btn", type: "button" });
    const paintTr = () => trBtn.replaceChildren(icon("lang"), sent.trEl.classList.contains("is-open") ? "Masquer la traduction" : "Traduire la phrase");
    trBtn.addEventListener("click", () => { sent.trEl.classList.toggle("is-open"); paintTr(); positionPop(); });
    paintTr();
    actions.append(trBtn, h("button", { class: "btn primary", type: "button", onclick: () => { closePop(); Player.start(s, ti); } }, icon("from"), "Lire à partir d'ici"));
  } else if (R.sentences.length) {
    actions.append(h("button", { class: "btn primary", type: "button", onclick: () => { closePop(); Player.start(0, 0); } }, icon("from"), "Lire depuis le début"));
  }

  pop.replaceChildren(...[
    h("div", { class: "pop-head" },
      h("div", { class: "hw" },
        h("span", { class: "pop-form", id: "pop-form", lang: "sv", text: tk.text }),
        g && g.pos ? h("span", { class: "pop-pos", text: g.pos }) : null,
        lemma.toLowerCase() !== tk.text.toLowerCase() ? h("p", { class: "pop-lemma" }, "forme de ", h("b", { lang: "sv", text: lemma })) : null),
      h("button", { class: "pbtn pop-x", type: "button", "aria-label": "Fermer (Échap)", onclick: () => closePop(true) }, icon("close"))),
    h("p", { class: "pop-fr", text: (g && str(g.fr)) || "Pas encore de traduction pour ce mot dans le glossaire." }),
    g && g.g ? h("p", { class: "pop-g", text: g.g }) : null,
    exprs.length ? h("div", { class: "pop-expr" }, h("span", { class: "label", text: exprs.length > 1 ? "Expressions de la phrase" : "Expression de la phrase" }),
      exprs.map((e) => h("p", null, h("b", { lang: "sv", text: e.sv }), " — " + str(e.fr)))) : null,
    actions].filter(Boolean));   // replaceChildren would print "null
  pop.hidden = false;
  $("#scrim").hidden = false;
  positionPop();
  pop.focus({ preventScroll: true });
}
function positionPop() {
  const pop = $("#pop");
  if (pop.hidden || !R || !R.openEl) return;
  if (window.innerWidth < 760) { pop.style.left = pop.style.top = ""; return; }
  const r = R.openEl.getBoundingClientRect();
  const w = pop.offsetWidth, ph = pop.offsetHeight;
  const barTop = window.innerHeight - ($("#player").offsetHeight || 80);
  let top = r.bottom + 10;
  if (top + ph > barTop - 10) top = Math.max(10, r.top - ph - 10);
  pop.style.left = clamp(r.left + r.width / 2 - w / 2, 16, window.innerWidth - w - 16) + "px";

}

function toggleSave(wkey, tk, g, sent) {
  if (isSaved(wkey)) {
    const prev = S.words[wkey];
    putWord(wkey, { del: true });
    toast(`« ${prev.lemma || tk.text} » retiré de Mes mots.`, { label: "Annuler", run: () => { putWord(wkey, { ...prev }); refreshSavedMarks(); } });
  } else {
    const old = S.words[wkey];
    putWord(wkey, {
      lemma: (g && str(g.l)) || tk.text, form: tk.text, fr: (g && str(g.fr)) || "", pos: (g && str(g.pos)) || "", g: (g && str(g.g)) || "",
      ex: sent ? { sv: sent.sv, fr: sent.fr } : { sv: R.t.title, fr: R.t.titleFr },
      textId: R.id, level: R.t.level, box: 1, due: today(), added: (old && old.added) || Date.now()
    });
    toast(`« ${(g && g.l) || tk.text} » ajouté à Mes mots.`);
  }
  refreshSavedMarks();
}

/* =====================================================================
   11. QUIZ
   ===================================================================== */
function buildQuiz(t, prog) {
  const n = t.questions.length;
  R.answers = Array.from({ length: n }, (_, i) => (prog.ans && Number.isInteger(prog.ans[i]) && prog.ans[i] < t.questions[i].options.length ? prog.ans[i] : -1));
  const sec = h("section", { class: "quiz", id: "quiz", "aria-labelledby": "quiz-h" });
  const frSwitch = h("label", { class: "switch", for: "quiz-fr" },
    h("input", { id: "quiz-fr", type: "checkbox", checked: UI.quizFr, onchange: (e) => { UI.quizFr = e.target.checked; saveUI(); paintQuiz(); } }), "Voir en français");
  sec.append(h("div", { class: "quiz-head" },
    h("div", null, h("span", { class: "label", text: `Compréhension · ${plural(n, "question", "questions")}` }), h("h2", { id: "quiz-h", lang: "sv", text: "Frågor" })),
    frSwitch));
  const list = h("div", { id: "quiz-list" });
  sec.append(list, h("div", { id: "quiz-score" }));
  setTimeout(paintQuiz, 0);
  return sec;
}
function paintQuiz() {
  if (!R) return;
  const list = $("#quiz-list");
  if (!list) return;
  const qs = R.t.questions;
  list.replaceChildren();
  qs.forEach((q, qi) => {
    const chosen = R.answers[qi];
    const done = chosen >= 0;
    const box = h("div", { class: "q", role: "group", "aria-labelledby": `q-${qi}` },
      h("span", { class: "q-n", text: `${qi + 1}/${qs.length}` }),
      h("p", { class: "q-sv", id: `q-${qi}`, lang: "sv", text: q.q }),
      UI.quizFr && q.qFr ? h("p", { class: "q-fr", text: q.qFr }) : null);
    const opts = h("div", { class: "opts" });
    q.options.forEach((o, oi) => {
      let cls = "opt";
      if (done && oi === q.answer) cls += " right";
      else if (done && oi === chosen) cls += " wrong";
      const ofr = Array.isArray(q.optionsFr) ? str(q.optionsFr[oi]) : "";
      opts.append(h("button", { class: cls, type: "button", disabled: done, "aria-pressed": done ? String(oi === chosen) : null,
        onclick: () => answer(qi, oi) },
        h("span", { class: "k", text: "ABCDEF"[oi] || "·" }), h("span", { lang: "sv", text: str(o) }),
        UI.quizFr && ofr ? h("span", { class: "ofr", text: ofr }) : null));
    });
    box.append(opts);
    if (done) {
      const right = chosen === q.answer;
      box.append(h("p", { class: "verdict " + (right ? "ok" : "ko"), role: "status" },
        h("b", { text: right ? "Bonne réponse. " : `Pas tout à fait : la bonne réponse est ${"ABCDEF"[q.answer]}. ` }), str(q.explFr)));
    }
    list.append(box);
  });
  const score = $("#quiz-score");
  score.replaceChildren();
  if (R.answers.every((a) => a >= 0)) {
    const c = R.answers.filter((a, i) => a === qs[i].answer).length;

/* =====================================================================
   13b. JEU — « Relier les paires » (#jeu)
   Two columns, always 5 + 5 words visible: Swedish on the left, French
   on the right, each column shuffled. Pick a Swedish word (it is read
   aloud with the app's Swedish voice), then its translation. A right
   pair fades out and the next pair of the pool takes its two slots; a
   wrong one flashes and counts as an error. The game is a run of waves
   of 5 pairs until the chosen total (10…50) is matched.
   Pair selection — one rule set, applied to every glossary entry:
   · French side: `fr` trimmed; if it contains "(", only the part before
     the first "(" is kept (trailing , ; : removed). The entry is dropped
     when the result is empty, longer than 30 characters, contains one of
     ; : ( ) [ ] = « » … or "...", or has no letter.

     French equals the Swedish word (nothing to learn).
   · Swedish side (single display rule): the word exactly as it appears in
     the text, i.e. the glossary key. `fr` translates that contextual form
     ("sorterar" → "trions", "året" → "l'année"), so pairing it with the
     lemma would mismatch person, tense or definiteness. The lemma `l` is
     printed underneath in small type when it differs from the form.

     text (accents/case folded), so two French words never read the same.
   · Size: the chosen total; when the source offers fewer usable pairs,

/* ---- Best scores */

/** Start a game. `want`: number of pairs (defaults to the chosen size). */

  const run = ++Game.run;
  Object.assign(Game, { status: "loading", level, source, srcLabel: gameSourceLabel(level, source), pairs: [], next: 0, left: [], right: [], sel: -1,
    found: 0, errors: 0, t0: 0, elapsed: 0, msg: "", want: n, error: null, record: null });
  if (App.view === "jeu") renderGame();
  let pool;
  try {
    const map = await loadLevel(level);
    const texts = source === "all" ? [...map.values()] : [map.get(source)].filter(Boolean);
    pool = gameUniquePairs(gameCandidates(texts));
  } catch (e) {
    if (run !== Game.run) return;
    Game.status = "error"; Game.error = e;
    if (App.view === "jeu") renderGame();
    return;
  }
  if (run !== Game.run) return;
  Game.available = pool.length;
  if (pool.length < n) {
    Game.status = "short";
    if (App.view === "jeu") { renderGame(); const b = $("#g-short button"); if (b) b.focus(); }
    return;
  }
  Game.pairs = pool.slice(0, n);
  const first = Array.from({ length: Math.min(GAME_WAVE, n) }, (_, i) => i);
  Game.left = shuffle(first.slice()).map((p) => ({ p, state: "idle" }));
  Game.right = shuffle(first.slice()).map((p) => ({ p, state: "idle" }));
  Game.next = first.length;
  Game.status = "play";
  Game.t0 = Date.now();
  Game.tick = setInterval(paintGameClock, 1000);
  Game.msg = "Choisissez un mot suédois à gauche.";
  if (App.view === "jeu") { renderGame(); const b = $("#m-sv-0"); if (b) b.focus(); }
}

  const prev = Game.sel;
  Game.sel = i;
  if (prev >= 0 && prev !== i) paintSlot("sv", prev);
  paintSlot("sv", i);
  const p = Game.pairs[s.p];
  try { speakOnce(p.sv, null, 0.9); } catch { /* speech is optional */ }

/* =====================================================================
   13d. JEU — « Écouter et choisir » (#jeu, third sub-choice)
   A Swedish word is read aloud (speakOnce) when its round starts and
   can be replayed with « Réécouter ». Four Swedish words are offered;
   the player taps the one heard. Right answer: green. Wrong answer: red,
   with the right word and its French translation. « Suivant » goes on.
   Words come only from the glossaries of the chosen level's texts, through
   the same filters as « Relier les paires » (gameCandidates, then
   gameUniquePairs): no duplicate lemma, form or French text. When the
   level has fewer usable words than asked, the maximum is played and the
   screen says so. Score = right answers, Erreurs = wrong answers.
   Distractors are other words of the same level, chosen by resemblance
   to the right word (listenSimilarity). For round i of n, p = i / (n - 1)
   and the wanted resemblance is:
     Facile     0,1 all along                    (stays weak)
     Moyen      0,1 + 0,5 p                      (rises moderately, to 0,6)
     Difficile  0,1 + 0,9 p²                     (low at first, high at the end)
   Memory only: nothing is stored.
   ===================================================================== */
const LISTEN_OPTS = 4;
const LISTEN_DIFFS = [
  { key: "facile", label: "Facile", want: () => 0.1 },
  { key: "moyen", label: "Moyen", want: (p) => 0.1 + 0.5 * p },
  { key: "difficile", label: "Difficile", want: (p) => 0.1 + 0.9 * p * p },
];
const ListenGame = { status: "setup", run: 0, level: "A1", count: 10, difficulty: "facile", pool: [], deck: [],
  round: 0, score: 0, errors: 0, choices: [], chosenIndex: -1, note: "", error: null };

/** Resemblance of two Swedish words, from 0 (nothing shared) to 1 (same first three letters, lengths within 1).
 *  sim = 0,5 · min(leading letters in common, 3) / 3  +  0,5 · (|length a − length b| ≤ 1). Compared folded (fold). */
function listenSimilarity(a, b) {
  const x = fold(a), y = fold(b);
  let p = 0;
  while (p < x.length && p < y.length && x[p] === y[p]) p++;
  return 0.5 * (Math.min(p, 3) / 3) + (Math.abs(x.length - y.length) <= 1 ? 0.5 : 0);
}
/** Four options for the round: the right word, then the three words closest to the wanted resemblance. */
function listenBuildRound() {
  const d = LISTEN_DIFFS.find((x) => x.key === ListenGame.difficulty) || LISTEN_DIFFS[0];
  const n = ListenGame.deck.length;
  const p = n > 1 ? ListenGame.round / (n - 1) : 0;
  const want = d.want(p);
  const target = ListenGame.deck[ListenGame.round];
  const ranked = ListenGame.pool
    .filter((c) => c !== target && fold(c.sv) !== fold(target.sv))
    .map((c) => ({ c, gap: Math.abs(listenSimilarity(target.sv, c.sv) - want) + Math.random() * 0.02 }))
    .sort((a, b) => a.gap - b.gap);
  const picked = [target];
  for (const { c } of ranked) {
    if (picked.length === LISTEN_OPTS) break;
    if (picked.every((o) => fold(o.sv) !== fold(c.sv))) picked.push(c);
  }
  ListenGame.choices = shuffle(picked);
  ListenGame.chosenIndex = -1;
}
/** Reads the round's Swedish word aloud; speech is optional, so any failure is ignored. */
function listenSpeak() {
  try { speakOnce(ListenGame.deck[ListenGame.round].sv, null, 0.9); } catch { /* speech is optional */ }
}
async function listenStart() {
  const run = ++ListenGame.run;
  const level = ListenGame.level;
  Object.assign(ListenGame, { status: "loading", error: null, note: "", pool: [], deck: [], round: 0, score: 0, errors: 0, choices: [], chosenIndex: -1 });
  if (App.view === "jeu") renderGame();
  let pool;
  try {
    const map = await loadLevel(level);
    pool = gameUniquePairs(gameCandidates([...map.values()]));
  } catch (e) {
    if (run !== ListenGame.run) return;
    ListenGame.status = "error"; ListenGame.error = e;
    if (App.view === "jeu") renderGame();
    return;
  }
  if (run !== ListenGame.run) return;
  if (pool.length < LISTEN_OPTS) {
    ListenGame.status = "few";
    if (App.view === "jeu") renderGame();
    return;
  }
  const n = Math.min(ListenGame.count, pool.length);
  ListenGame.note = n < ListenGame.count
    ? `Le niveau ${level} ne compte que ${plural(pool.length, "mot utilisable", "mots utilisables")} : la série est donc de ${n} mots au lieu de ${ListenGame.count}.`
    : "";
  ListenGame.pool = pool;
  ListenGame.deck = shuffle(pool.slice()).slice(0, n);
  ListenGame.status = "play";
  listenBuildRound();
  listenSpeak();
  if (App.view === "jeu") { renderGame(); const b = $("#l-opt-0"); if (b) b.focus(); }
}
/** One answer per round: count it, mark it, and wait for « Suivant ». */
function listenChoose(k) {
  const o = ListenGame.choices[k];
  if (ListenGame.status !== "play" || !o || ListenGame.chosenIndex >= 0) return;
  ListenGame.chosenIndex = k;
  if (o.sv === ListenGame.deck[ListenGame.round].sv) ListenGame.score++; else ListenGame.errors++;
  renderGame();
  const b = $("#l-next"); if (b) b.focus();
}
function listenAdvance() {
  if (ListenGame.status !== "play" || ListenGame.chosenIndex < 0) return;
  if (ListenGame.round + 1 < ListenGame.deck.length) { ListenGame.round++; listenBuildRound(); listenSpeak(); }
  else ListenGame.status = "done";
  renderGame();
  const b = $(ListenGame.status === "done" ? "#l-again" : "#l-opt-0"); if (b) b.focus();
}
function listenRender(wrap) {
  if (ListenGame.status === "done") wrap.append(listenEndView());
  else if (ListenGame.status === "play") wrap.append(listenPlayView());
  else wrap.append(listenSetup());
}
/** Texts of a level in the catalog (1 while the catalog is not loaded, so nothing is blocked). */
const listenLevelHasTexts = (lv) => (Data.catalog ? Data.list.filter((t) => t.level === lv).length : 1);
function listenSetup() {
  const press = (group, pred) => { for (const c of group.children) c.setAttribute("aria-pressed", String(pred(c))); };
  const emptyNote = h("p", { class: "empty-note", id: "l-empty" });
  const start = h("button", { class: "btn primary", type: "button", id: "l-start", onclick: () => listenStart() });
  const paintLevel = () => {
    const none = listenLevelHasTexts(ListenGame.level) === 0;
    start.disabled = none || ListenGame.status === "loading";
    start.textContent = ListenGame.status === "loading" ? "Préparation des mots…" : "Commencer la partie";
    emptyNote.hidden = !none;
    emptyNote.textContent = `Les textes du niveau ${ListenGame.level} arrivent bientôt. Choisissez un autre niveau.`;
  };
  const levels = h("div", { class: "chips", role: "group", "aria-labelledby": "l-lv-label", id: "l-levels" });
  for (const l of LEVELS) {
    levels.append(h("button", { class: "chip", type: "button", "data-lv": l, "aria-label": `${l} ${levelName(l)}`,
      "aria-pressed": String(l === ListenGame.level), disabled: !listenLevelHasTexts(l),
      onclick: () => {
        ListenGame.level = l;
        if (ListenGame.status === "error" || ListenGame.status === "few") ListenGame.status = "setup";
        press(levels, (c) => c.dataset.lv === l); paintLevel();
      } }, l));
  }
  const sizes = h("div", { class: "chips", role: "group", "aria-labelledby": "l-n-label", id: "l-sizes" });
  for (const n of GAME_SIZES) {
    sizes.append(h("button", { class: "chip", type: "button", "data-n": n, "aria-label": `${n} mots`,
      "aria-pressed": String(n === ListenGame.count), onclick: () => { ListenGame.count = n; press(sizes, (c) => Number(c.dataset.n) === n); } }, String(n)));
  }
  const diffs = h("div", { class: "chips", role: "group", "aria-labelledby": "l-d-label", id: "l-diffs" });
  for (const d of LISTEN_DIFFS) {
    diffs.append(h("button", { class: "chip", type: "button", "data-d": d.key, "aria-label": `Difficulté ${d.label}`,
      "aria-pressed": String(d.key === ListenGame.difficulty), onclick: () => { ListenGame.difficulty = d.key; press(diffs, (c) => c.dataset.d === d.key); } }, d.label));
  }
  paintLevel();
  const wrap = h("section", { class: "g-setup", "aria-label": "Réglages du jeu Écouter et choisir" },
    h("div", { class: "g-field" }, h("span", { class: "label", id: "l-lv-label", text: "Niveau" }), levels),
    h("div", { class: "g-field" }, h("span", { class: "label", id: "l-n-label", text: "Nombre de mots" }), sizes),
    h("div", { class: "g-field" }, h("span", { class: "label", id: "l-d-label", text: "Difficulté" }), diffs),
    h("div", { class: "g-go" }, start));
  const out = h("div", null, wrap, emptyNote);
  if (ListenGame.status === "error") out.append(errorState(`Les textes du niveau ${ListenGame.level} n'ont pas pu être chargés.`, ListenGame.error, () => listenStart()));
  else if (ListenGame.status === "few") out.append(h("p", { class: "empty-note", role: "status", text: `Le niveau ${ListenGame.level} n'a pas assez de mots utilisables (quatre au minimum) pour proposer quatre choix.` }));
  return out;
}
function listenPlayView() {
  const total = ListenGame.deck.length, target = ListenGame.deck[ListenGame.round], answered = ListenGame.chosenIndex >= 0;
  const picked = answered ? ListenGame.choices[ListenGame.chosenIndex] : null;
  const right = answered && picked.sv === target.sv;
  const msg = !answered ? "Touchez le mot suédois que vous avez entendu."
    : right ? ["Bonne réponse : ", h("b", { lang: "sv", text: target.sv }), ` = ${target.fr}.`]
    : ["Mauvaise réponse : vous avez choisi ", h("b", { lang: "sv", text: picked.sv }), ". La bonne réponse est ", h("b", { lang: "sv", text: target.sv }), ` = ${target.fr}.`];
  return h("div", null,
    h("div", { class: "g-bar" },
      h("span", { class: "g-src", text: `Mot ${ListenGame.round + 1} / ${total}` }),
      h("span", { class: "g-count" },
        h("span", null, "Score", h("b", { id: "l-score", text: `${ListenGame.score}/${total}` })),
        h("span", null, "Erreurs", h("b", { id: "l-errors", text: String(ListenGame.errors) })))),
    ListenGame.note ? h("p", { class: "empty-note", role: "status", text: ListenGame.note }) : null,
    h("div", { class: "pic-stage" },
      h("button", { class: "btn", type: "button", id: "l-replay", "aria-label": "Réécouter le mot suédois", onclick: () => listenSpeak() }, icon("speaker"), "Réécouter")),
    h("p", { class: "g-msg" + (answered && !right ? " is-wrong" : ""), id: "l-msg", role: "status", "aria-live": "polite" }, msg),
    h("div", { class: "pic-opts", role: "group", "aria-label": "Mots suédois proposés" },

        else if (answered && k === ListenGame.chosenIndex) cls.push("is-wrong");
        return h("button", { class: cls.join(" "), type: "button", id: `l-opt-${k}`, "aria-pressed": String(answered && k === ListenGame.chosenIndex),
          "aria-disabled": answered ? "true" : null, onclick: () => listenChoose(k) },
          h("span", { class: "pic-key", "aria-hidden": "true", text: String(k + 1) }),

function listenEndView() {

/* =====================================================================
   14. TOASTS
   ===================================================================== */
function toast(msg, action) {
  const box = $("#toasts");
  const el = h("div", { class: "toast", role: "status" }, h("span", { text: msg }));
  if (action) el.append(h("button", { type: "button", text: action.label, onclick: () => { el.remove(); action.run(); } }));
  while (box.children.length >= 2) box.firstChild.remove();
  box.append(el);
  setTimeout(() => el.remove(), action ? 6500 : 3200);
}

/* =====================================================================
   15. GLOBAL EVENTS: player controls, keyboard, outside clicks
   ===================================================================== */
function wireShell() {
  $("#btn-play").replaceChildren(icon("play"));
  $("#btn-prev").replaceChildren(icon("prev"));
  $("#btn-next").replaceChildren(icon("next"));
  $("#btn-play").addEventListener("click", () => { closePop(); Player.toggle(); });
  $("#btn-prev").addEventListener("click", () => { closePop(); Player.prev(); });
  $("#btn-next").addEventListener("click", () => { closePop(); Player.next(); });
  $("#btn-tools").addEventListener("click", (e) => {
    const t = $("#tools"); t.hidden = !t.hidden;
    e.currentTarget.setAttribute("aria-expanded", String(!t.hidden));
    renderPlayer();
  });
  $("#rate").addEventListener("input", (e) => {
    if (!R) return;
    const v = Math.round(Number(e.target.value) * 100) / 100;
    const lv = R.t.level;
    changeSettings((s) => { if (v === RATE_DEFAULT[lv]) delete s.rates[lv]; else s.rates[lv] = v; });
    $("#rate-out").textContent = fmtRate(v);
    $("#btn-tools").textContent = fmtRate(v);
    Player.restartSoon();
  });
  // Delegated: font size & translation toggles exist in the reader header and the player panel
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-size]");
    if (!b) return;
    changeSettings((s) => { s.fontSize = clamp(s.fontSize + 2 * Number(b.dataset.size), FONT_MIN, FONT_MAX); });
    applySettings();
    positionPop();
  });
  document.addEventListener("change", (e) => {
    if (!e.target.matches("[data-tr-toggle]")) return;
    changeSettings((s) => { s.showTr = e.target.checked; });
    applySettings();
  });
  $("#scrim").addEventListener("click", () => closePop());
  document.addEventListener("pointerdown", (e) => {
    const pop = $("#pop");
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest(".w") && window.innerWidth >= 760) closePop();
  });
  window.addEventListener("scroll", () => { if (!$("#pop").hidden && window.innerWidth >= 760) positionPop(); }, { passive: true });
  window.addEventListener("resize", () => { positionPop(); if (R) renderPlayer(); });
  window.addEventListener("hashchange", () => route(location.hash));
  window.addEventListener("pagehide", () => Persist.flushAll());
  document.addEventListener("visibilitychange", () => { if (document.hidden) Persist.flushAll(); });
  for (const a of document.querySelectorAll("[data-nav]")) {
    a.addEventListener("click", (e) => { e.preventDefault(); const k = a.dataset.nav; if (App.view === "review") App.view = ""; go(k === "lib" ? "" : k); });
  }
  document.addEventListener("keydown", onKey);
}
function onKey(e) {
  if (e.key === "Escape") {
    if (closePop(true)) { e.preventDefault(); return; }
    const t = $("#tools");
    if (!t.hidden) { t.hidden = true; $("#btn-tools").setAttribute("aria-expanded", "false"); $("#btn-tools").focus(); e.preventDefault(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tg = e.target;
  const tag = tg && tg.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (tg && tg.isContentEditable)) return;
  if (App.view === "review") {
    if (e.key === " " && !Review.flipped && tag !== "BUTTON") { e.preventDefault(); $("#rv-flip") && $("#rv-flip").click(); }
    else if (Review.flipped && e.key === "1") $("#rv-again") && $("#rv-again").click();
    else if (Review.flipped && e.key === "2") $("#rv-know") && $("#rv-know").click();
    return;
  }
  if (App.view !== "reader" || !R) return;
  const onWord = tg && tg.classList && tg.classList.contains("w");
  if (e.key === " " || e.code === "Space") {
    if (tag === "BUTTON" || tag === "A" || tag === "SUMMARY") return;
    e.preventDefault(); closePop(); Player.toggle();
  } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    if (onWord) {   // roving focus between words
      const all = [...document.querySelectorAll(".r-title .w, .text .w")];
      const i = all.indexOf(tg) + (e.key === "ArrowRight" ? 1 : -1);
      if (all[i]) { setRoving(all[i]); all[i].focus(); }
      return;
    }
    closePop();
    e.key === "ArrowLeft" ? Player.prev() : Player.next();
  } else if (e.key === "Enter" && onWord) {
    e.preventDefault(); openWord(tg);
  }
}

/* =====================================================================
   16. BOOT — first paint never waits for db/user or voices
   ===================================================================== */
function start(hot) {
  document.documentElement.lang = "fr";
  Persist.loadLocal();
  applySettings();
  wireShell();
  updateBadge();
  renderSyncNote();
  initVoices();
  route((hot && hot.route) || location.hash);
  const afterCatalog = () => { if (App.view === "lib") renderLibrary(); else if (App.view === "jeu") renderGame(); };
  loadCatalog().then(afterCatalog, afterCatalog);
  Remote.connect().catch(() => { Remote.status = "off"; renderSyncNote(); });   // sync failure: keep local storage
  // Re-evaluate due cards when the day changes while the page stays open.
  setInterval(updateBadge, 60 * 1000);
}
(function boot() {
  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ route: location.hash })); } catch { /* optional */ }
  let started = false;   // start() runs exactly once, whichever path gets there first
  const launch = (data) => { if (started) return; started = true; start(data); };
  try {
    if (hot && typeof hot.ready === "function") { hot.ready(launch); return; }
  } catch (err) {
    console.error("Démarrage hôte échoué, mode autonome", err);   // log, do not swallow; standalone start below if not started
  }
  launch((hot && hot.data) || {});   // no-op if start() already ran (started flag)
})();

/* PWA: service worker registration (optional; never blocks rendering). */
(function registerSW() {
  try {
    if (!("serviceWorker" in navigator)) return;
    if (!/^https?:$/.test(location.protocol)) return;
    const go = () => {
      try {
        navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => { /* offline mode unavailable */ });
      } catch { /* ignore */ }
    };
    if (document.readyState === "complete") go(); else window.addEventListener("load", go, { once: true });
  } catch { /* ignore */ }
})();
